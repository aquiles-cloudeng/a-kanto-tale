function softEnding(s){
  if(s.rocket)return s.rocketPts>=ROCKET_MAX?'rocket_alto':s.rocketPts>=30?'rocket_vet':'rocket_low';
  if(s.gymOwner)return 'gym_small';
  if(dexN(s)>=120)return 'collector';
  if(s.badges.length>=8)return 'finalista';
  if(s.pubs>=1)return 'scholar';
  if(s.badges.length>=4)return 'retador';
  return 'viajero';
}
// Finales a elegir: cada uno es una condición que se cumple; si hay varias, elegís cuál cerrar (o seguís jugando por otro)
const END_PRIO=['champion','rocket_boss','gym_leader','dex_complete','profesor'];
function endOffers(s){
  const o=[];
  if(s.leagueWon)o.push('champion');
  if(s.rocketBoss)o.push('rocket_boss');
  if(s.fame>=FAME_MAX)o.push('gym_leader');
  if(dexN(s)>=151)o.push('dex_complete');
  if(dexN(s)>=151&&!s.rocket)o.push('profesor');
  return END_PRIO.filter(k=>o.includes(k));
}

function checkEnding(s){
  if(s.forcedEnd)return s.forcedEnd;
  if(s.heat>=5)return 'arrested';
  if(s.t>=MAXT){const o=endOffers(s);return o.length?o[0]:softEnding(s);}
  return null;
}
function endSeason(s,seasons){
  s.t+=seasons+s.pendingTime;s.pendingTime=0;
  if(s.items.pase_libre&&age(s)>=PASE_HASTA){
    delete s.items.pase_libre;
    s.notice='⌛ Cumpliste '+PASE_HASTA+' años y tu Pase libre venció sin que lo usaras. De ahora en más, si te atrapan, vas preso.';
  }
  let usedPass=false;
  if(s.heat>=5&&s.items.pase_libre){
    usedPass=true;delete s.items.pase_libre;s.heat=2;
    s.notice='🔓 La policía te atrapó, pero tu Pase libre te sacó de la comisaría. Se consumió, y tu Heat bajó a 2. La próxima vez no habrá segunda oportunidad.';
  }
  // primero se revisa el final (con el Heat que dejó esta estación) y recién después se enfría
  const e=checkEnding(s);
  if(e){s.ending=e;return e;}
  if(!usedPass&&s.heat>0&&(!s.rocket||s.t%2===0))s.heat--; // la estación del pase, el Heat queda en 2 tal como se avisa
  return null;
}

const achievementsOf=s=>ACHS.filter(a=>{try{return a.f(s);}catch(e){return false;}});
function scoreOf(s){
  const ach=achievementsOf(s);const tp=teamPower(s);
  const sumSt=STATS.reduce((a,k)=>a+s.st[k],0);
  const goal=s.t<MAXT&&s.ending&&s.ending!=='arrested';
  const parts=[
    ['Final: '+(ENDINGS[s.ending]?ENDINGS[s.ending].t:'—'),END_BASE[s.ending]||0],
    ['Pokédex ('+dexN(s)+(dexN(s)===1?' especie':' especies')+' × 4)',dexN(s)*4],
    ['Shinies ('+shinyN(s)+(shinyN(s)===1?' especie':' especies')+' × 10)',shinyN(s)*10],
    ['Medallas ('+s.badges.length+' × 25)',s.badges.length*25],
    ['Stats ('+sumSt+' puntos; los 10 iniciales no cuentan)',Math.max(0,(sumSt-10)*3)],
    ['Poder del equipo ('+Math.round(tp)+')',Math.max(0,Math.round((tp-300)*0.8))],
    ['Logros ('+ach.length+(ach.length===1?' logro':' logros')+' × 40)',ach.length*40]
  ];
  if(goal)parts.push(['Final antes de tiempo ('+(MAXT-s.t)+' estaciones sobrantes × 3)',(MAXT-s.t)*3]);
  const total=parts.reduce((a,p)=>a+p[1],0);
  return {total,parts,ach};
}

function epilogue(s){
  const P=[];const o=ORIGINS.find(x=>x.id===s.origin)||{name:'tu pueblo',mon:'Rattata'};
  const stName=mon(s.starter||s.box[0].sp).name;const age=Math.min(35,10+Math.floor(s.t/4));
  P.push(`${s.name?s.name+', todo':'Todo'} empezó a los 10 años en ${o.name}, con ${stName} y ${o.mon} a tu lado.`);
  const v=s.voc?({campeon:'Elegiste la gloria de los gimnasios',coleccionista:'Elegiste el camino del coleccionista',picaro:'Elegiste el lado oscuro de la región',profesor:'Elegiste el camino de la investigación'})[s.voc]:'Nunca te ataste a una sola vocación';
  const bits=[];
  if(s.badges.length)bits.push(s.badges.length===8?'juntaste las 8 medallas':'juntaste '+s.badges.length+' medalla'+(s.badges.length===1?'':'s'));
  if(s.leagueWon)bits.push(s.leagueFails?`entraste a la Liga y, tras ${s.leagueFails} caída${s.leagueFails===1?'':'s'}, la ganaste`:'ganaste la Liga en tu primer intento');
  if(s.rocket)bits.push(s.rocketBoss?'escalaste hasta el mando del Equipo Rocket':'llegaste a ser '+rocketRank(s)+' del Equipo Rocket');
  if(s.gymOwner)bits.push('abriste tu propio gimnasio de tipo '+TES[s.gymType]);
  if(s.pubs)bits.push('publicaste '+s.pubs+' trabajo'+(s.pubs===1?'':'s')+' de investigación');
  if(s.counters.shipDone)bits.push('cruzaste el mar en el S.S.');
  P.push(v+(bits.length?': '+bits.join(', ')+'.':'.'));
  if(s.counters.rivalFights)P.push(`Te cruzaste con tu rival Blue ${s.counters.rivalFights} ${s.counters.rivalFights===1?'vez':'veces'} y le ganaste ${s.counters.rivalWin||0}.`);
  const gl=s.counters.gymLoss||0;
  if(s.badges.length>=8&&gl===0)P.push('No perdiste ni un solo combate de gimnasio en todo el camino.');
  else if(gl>0)P.push(`Perdiste ${gl} combate${gl===1?'':'s'} de gimnasio, y cada uno te enseñó algo.`);
  const best=[...s.box].sort((a,b)=>pw(b)-pw(a))[0];
  const tm=teamMons(s);const tc={};tm.forEach(m=>mon(m.sp).types.forEach(t=>tc[t]=(tc[t]||0)+1));
  const topT=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
  let q=`Tu Pokédex terminó con ${dexN(s)} de 151 especies`+(shinyN(s)?` (${shinyN(s)} shiny)`:'')+`. Tu compañero más fuerte fue ${nameOf(best)}, con poder ${pw(best)}`;
  if(topT&&topT[1]>=3)q+=`, y tu equipo se inclinó por el tipo ${TES[topT[0]]}`;
  P.push(q+'.');
  const top=STATS.slice().sort((a,b)=>s.st[b]-s.st[a])[0];
  P.push(`Tu mayor virtud fue el ${SL[top]} (${s.st[top]})`+(s.rep>=10?` y la gente te conoce: ${repRank(s)}.`:s.rep<=-3?', aunque tu fama no fue buena.':'.'));
  if(s.moral>=3)P.push('Mirás hacia atrás y dormís tranquilo: casi siempre hiciste lo correcto.');
  else if(s.moral<=-3)P.push('Algunas decisiones todavía te pesan, pero elegiste tu camino sin mirar atrás.');
  if(s.rocket&&!s.rocketBoss&&s.ending==='arrested')P.push('La policía por fin te alcanzó.');
  P.push(`Terminás tu historia a los ${age} años, después de ${s.t} estaciones.`);
  return P;
}

function rivalFoe(s,i){
  const st=s.starter?mon(s.starter).types:[];

}

function iconify(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode&&n.parentNode.nodeName;return p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA'?NodeFilter.FILTER_REJECT:(EM_RX.test(n.nodeValue)?(EM_RX.lastIndex=0,NodeFilter.FILTER_ACCEPT):(EM_RX.lastIndex=0,NodeFilter.FILTER_REJECT));}});
  const L=[];while(w.nextNode())L.push(w.currentNode);
  for(const n of L){
    const frag=document.createDocumentFragment();let last=0;const txt=n.nodeValue;EM_RX.lastIndex=0;let m;
    while((m=EM_RX.exec(txt))){const src=emSrc(m[1]);if(!src)continue;if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));const im=document.createElement('img');im.className='em';im.alt=m[1];im.src=src;frag.appendChild(im);last=m.index+m[0].length;}

  for(const k in s.items)if(!ITEMS[k].stone)c+=`<span class="chip" title="${esc(ITEMS[k].desc)}">${itemIc(k,18)} ${esc(ITEMS[k].name)}</span>`;
  const sc=stoneCount(s);if(sc)c+=`<span class="chip">🪨 <b>${sc}</b> piedra${sc===1?'':'s'}</span>`;

function monRow(m,count,btn){

}

function rollAnim(r){
  // El marcador gira siempre hacia la derecha, vuelve a salir por la izquierda y va perdiendo velocidad hasta frenar en la tirada real
  const mk=$('rmark'),bar=$('rbar');if(!mk||!bar)return;
  let done=false,raf=0;
  const finish=()=>{if(done)return;done=true;cancelAnimationFrame(raf);r.shown=true;mk.style.left=r.roll+'%';
    const a=$('rres'),b=$('rcont');if(a){a.classList.remove('rhide');a.classList.add('rshow');}if(b){b.classList.remove('rhide');b.classList.add('rshow');}};
  bar.onclick=finish;
  const D=200+r.roll,T=1600;let t0=null;
  const step=ts=>{if(done)return;if(t0===null)t0=ts;const k=Math.min(1,(ts-t0)/T);
    const pos=D*(1-Math.pow(1-k,3));mk.style.left=(pos%100)+'%';
    if(k<1)raf=requestAnimationFrame(step);else setTimeout(finish,250);};
  raf=requestAnimationFrame(step);
}

}
const stoneUses=k=>{const L=[];for(const m of MON)for(const e of m.evo)if(e[1]==='s'&&e[2]===k)L.push(m.name+'→'+mon(e[0]).name);return L.join(', ');};

}

    h=`<h3>🏅 Logros y récords</h3><p class="sub mb">Se guardan en este navegador. Conseguiste <b>${n}</b> de ${ACHS.length} logros y descubriste <b>${nEnd}</b> de ${endKeys.length} finales.</p>
    <button class="btn sm" onclick="G.modal('hall')">🏛️ Ver el Salón de la Fama</button>`+`
    <h3 style="margin-top:12px">Logros</h3><div class="lines">${ACHS.map(a=>{const got=m.ach[a.id];return `<div style="${got?'':'opacity:.55'}"><span style="font-size:20px">${got?a.e:'🔒'}</span><div><b>${esc(a.n)}</b>${got?` <span class="sub">· ${fmtDate(got)}</span>`:''}<div class="sub">${esc(a.d)}</div></div></div>`;}).join('')}</div>
    <h3 style="margin-top:12px">Finales descubiertos</h3><div class="lines">${endKeys.map(k=>`<div style="${m.endings[k]?'':'opacity:.55'}"><span style="font-size:20px">${m.endings[k]?ENDINGS[k].e:'❔'}</span><div><b>${m.endings[k]?esc(ENDINGS[k].t):'Final sin descubrir'}</b>${m.endings[k]?` <span class="sub">· ×${m.endings[k]}</span>`:''}</div></div>`).join('')}</div>`;
  }else if(kind==='log'){
    h=`<h3>📜 Diario</h3>`+(s.log.length?[...s.log].reverse().map(l=>`<div class="logline">${esc(l)}</div>`).join(''):'<p class="sub">Todavía no pasó nada.</p>');
  }
  const back=kind.startsWith('dexmon:')?`<button class="btn sm" onclick="G.modal('dex')">← Pokédex</button>`:(kind==='bag'&&ctx.bagStone)?`<button class="btn sm" onclick="G.bagBack()">← Volver</button>`:'';
  ctx.modalKind=kind;
  $('mbox').innerHTML=`<div class="mtop">${back}<button class="btn sm" onclick="G.close()">✕ Cerrar</button></div>`+h+`<button class="btn" style="margin-top:10px;text-align:center" onclick="G.close()">Cerrar</button>`;
  $('modal').classList.add('on');
}

const G={
  new(){S_=null;const n=readSlots().length;
    if(n>=MAX_SLOTS){ctx={titleMsg:'Llegaste al máximo de '+MAX_SLOTS+' partidas guardadas. Borrá una para empezar otra.'};phase='title';view();window.scrollTo(0,0);return;}
    ctx={};phase='name';view();window.scrollTo(0,0);},
  nameOk(){const i=$('pname');ctx.name=cleanName(i?i.value:'');try{localStorage.setItem(NAME_KEY,ctx.name);}catch(e){}phase='origin';view();window.scrollTo(0,0);},
  toTitle(){S_=null;ctx={};phase='title';view();window.scrollTo(0,0);},
  delSlot(id){const sv=readSlots().find(x=>x.id===id);if(!sv)return;ask('¿Borrar la partida de '+(sv.state.name||'Sin nombre')+'?','Se pierde para siempre: no hay forma de recuperarla.','Sí, borrar',()=>{writeSlots(readSlots().filter(x=>x.id!==id));ctx.titleMsg=null;G.close();phase='title';view();});},
  cont(id){const x=readSlots().find(z=>z.id===id);if(!x)return;S_=x.state;ctx={};phase='menu';view();},
  origin(id){ctx.origin=id;phase='starter';view();},
  starter(n){ask('¿Elegir a '+n+'?','Va a ser tu primer Pokémon, el que te acompañe desde los 10 años. No se puede cambiar después.','Sí, elegir a '+n,()=>{S_=newGame(ctx.origin,n);S_.name=ctx.name||'';S_.slotId=Date.now();save();phase='menu';view();});},
  backOrigin(){phase='origin';view();},
  imgerr(el,n,size){const d=document.createElement('span');d.innerHTML=fb(n,size);el.replaceWith(d.firstChild);},
  act(id){
    if(S_)S_.notice=null;
    if(id==='explore'){phase='zone';view();return;}
    if(id==='train'){phase='trainmode';view();window.scrollTo(0,0);return;}
    if(id==='study'){ctx.years=1;phase='study';view();return;}
    if(id==='gym'){phase='gymprev';view();return;}
    if(id==='league'){phase='leagueprev';view();return;}
    if(id==='giovanni'){phase='giovprev';view();window.scrollTo(0,0);return;}
    if(id==='rkmission'){phase='rkmenu';view();window.scrollTo(0,0);return;}
    if(id==='market'){ctx.mk=Object.assign({lines:[]},mkL(S_));phase='market';view();window.scrollTo(0,0);return;}
    if(id==='ship'){ask('¿Usar el Ticket S.S. ahora?','El viaje ocupa <b>un año entero (4 estaciones)</b> y es de una sola vez: se consume el ticket. Vas a pelear 4 combates y recibir 3 regalos.','Sí, embarcar',()=>G.exec('ship'));return;}
    G.exec(id);
  },
  zone(id){G.exec('explore',id);},
  rk(kind){G.exec('rkmission',kind);},
  years(y){ctx.years=y;view();},
  stat(k){const y=ctx.years||1;ask('¿Estudiar '+y+' año'+(y===1?'':'s')+' en '+SL[k]+'?','Ocupa <b>'+(y*4)+' estaciones</b> sin explorar ni entrenar y da +'+(y===1?3:6)+' '+SL[k]+(y===2?' y +1 Ingenio':'')+'. Solo se puede estudiar un máximo de 2 veces.','Sí, estudiar',()=>G.exec('study',{years:y,stat:k}));},
  go(){
    const kind=phase==='leagueprev'?'league':phase==='giovprev'?'giovanni':'gym';
    const txt=kind==='league'?'Vas a enfrentar a los cuatro del Alto Mando y al Campeón, uno tras otro. Si perdés, se te va una estación y no ganás ningún bonus.':kind==='giovanni'?'Es el desafío final contra Giovanni. Si perdés, se te va una estación y podés intentarlo de nuevo, pero sin ningún bonus.':'Si perdés, se te va una estación (aunque la próxima vez tendrás un pequeño bonus por la experiencia).';
    ask(kind==='league'?'¿Entrar a la Liga ahora?':kind==='giovanni'?'¿Desafiar a Giovanni ahora?':'¿Desafiar el gimnasio ahora?',esc(txt),'Sí, desafiar',()=>G.exec(kind));
  },
  confirmYes(){const f=ctx.confirmFn;ctx.confirmFn=null;$('modal').classList.remove('on');if(f)f();},
  confirmNo(){ctx.confirmFn=null;$('modal').classList.remove('on');},
  share(){const s=S_;const info=ctx.endInfo;if(!info)return;const t=shareText(s,info);const msg=$('shmsg');
    const done=ok=>{if(msg)msg.textContent=ok?'¡Copiado! Pegalo donde quieras.':'No pude copiar solo; copialo a mano: '+t.replace(/\n/g,' · ');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>done(true),()=>fb());return;}}catch(e){}
    fb();
    function fb(){try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();done(ok);}catch(e){done(false);}}
  },
  guideFilter(q){q=String(q||'').trim().toLowerCase();let any=false;
    document.querySelectorAll('#gsec .gd').forEach(d=>{const t=d.textContent.toLowerCase();const ok=!q||t.includes(q);d.style.display=ok?'':'none';d.open=!!q&&ok;if(ok)any=true;});
    const n=$('gnone');if(n)n.style.display=any?'none':'';},
  trainPick(){const own=new Set(S_.box.map(m=>m.id));let sel=(S_.trainSel||[]).filter(id=>own.has(id));if(!sel.length)sel=[...S_.team];ctx.tsel=sel.slice(0,6);phase='trainpick';view();window.scrollTo(0,0);},
  tpt(id){const a=ctx.tsel=ctx.tsel||[];const i=a.indexOf(id);if(i>=0)a.splice(i,1);else if(a.length<6)a.push(id);view();},
  tpf(k,v){ctx.tpf=ctx.tpf||{q:'',lvl:false};ctx.tpf[k]=v;view();if(k==='q'){const i=$('tpq');if(i){i.focus();i.setSelectionRange(v.length,v.length);}}},
  trainGo(){const ids=(ctx.tsel||[]).slice(0,6);if(!ids.length)return;G.exec('train',ids);},
  back(){phase='menu';view();window.scrollTo(0,0);},
  // mercado
  mkOffer(sp){const e=dupeStacks(S_).find(x=>x.sp===sp);if(!e)return;ctx.mkSel=e.weakest.id;ctx.mkCands=tradeCandidates(S_,e.weakest);phase='mkoffer';view();window.scrollTo(0,0);},
  mkTake(n){const l=doTrade(S_,ctx.mkSel,n);if(l){ctx.mk.lines.push(l);ctx.mk.trades--;}phase='market';view();save();},
  mkStone(k){ctx.mkFrom=k;phase='mkstone';view();window.scrollTo(0,0);},
  mkSwap(k){const l=swapStone(S_,ctx.mkFrom,k);if(l){ctx.mk.lines.push(l);ctx.mk.swaps--;}phase='market';view();save();},
  mkEvo(id){const l=tradeEvolve(S_,id);if(l){ctx.mk.lines.push(l);ctx.mk.evos--;}view();save();},
  mkBack(){phase='market';view();window.scrollTo(0,0);},
  mkDone(){G.exec('market',ctx.mk.lines.length?ctx.mk.lines:['Recorriste el mercado sin cerrar ningún trato.']);},
  exec(id,arg){
    ctx.extraDone=false;
    const r=runAction(S_,id,arg);ctx.rep=r;ctx.armed=null;ctx.carry=[];
    if(r.pool&&r.lines.length){ctx.carry=r.lines;r.lines=[];} // las acciones con evento muestran todo junto en el resultado del evento
    if(r.lines.length){phase='report';view();window.scrollTo(0,0);}else G.next();
  },
  next(){
    const ev=nextEvent(S_,ctx.rep.pool);
    if(ev){ctx.ev=ev;ctx.armed=null;phase='event';view();window.scrollTo(0,0);}
    else if(ctx.carry&&ctx.carry.length){ctx.rep.lines=ctx.carry;ctx.carry=[];phase='report';view();window.scrollTo(0,0);}
    else G.fin();
  },
  opt(i){
    const o=ctx.ev.opts[i];
    const go=()=>{ctx.res=resolveOption(S_,ctx.ev,i);phase='eventres';view();window.scrollTo(0,0);};
    if(o.irrev){ask(o.label,'<b>Punto sin retorno.</b> '+esc(o.hint||'No vas a poder volver atrás después de elegir esto.'),'Sí, confirmar',go);return;}
    go();
  },
  fin(){
    const s=S_;const r=ctx.rep;
    if(!ctx.extraDone){const x=pendingExtra(s);if(x){ctx.extraDone=true;ctx.ev=x;ctx.armed=null;phase='event';view();window.scrollTo(0,0);return;}}
    ctx.extraDone=false;
    s.log.push(`Año ${Math.min(Math.floor(s.t/4),24)+1} · ${SEAS[s.t%4]} — ${r.title}${ctx.ev&&phase==='eventres'?' → '+ctx.ev.title:''}`);
    if(s.log.length>120)s.log.shift();
    const e=endSeason(s,r.seasons||1);
    ctx.ev=null;save();
    phase=e?'ending':'menu';view();window.scrollTo(0,0);
  },
  modal(k){ctx.bagStone=null;if(k!=='team')ctx.pend=null;modal(k);},close(){$('modal').classList.remove('on');ctx.bagStone=null;ctx.pend=null;ctx.modalKind=null;head();},
  teamUi(){if($('modal').classList.contains('on')&&ctx.modalKind==='team')modal('team');head();save();},
  rm(id){if(teamRemove(S_,id))G.teamUi();},
  add(id){const m=S_.box.find(x=>x.id===id);if(!m)return;
    const same=teamMons(S_).some(x=>x.sp===m.sp);
    if(!same&&S_.team.length>=6){ctx.pend=id;modal('team');return;}
    if(teamAddMon(S_,id))G.teamUi();},
  swap(outId){const inId=ctx.pend;ctx.pend=null;if(!inId)return;if(teamRemove(S_,outId))teamAddMon(S_,inId);G.teamUi();},
  pendCancel(){ctx.pend=null;modal('team');},
  tf(k,v){const f=ctx.tf=ctx.tf||{q:'',type:'',sort:'power',shiny:false,dup:false,evo:false};f[k]=v;modal('team');if(k==='q'){const i=$('tfq');if(i){i.focus();i.setSelectionRange(v.length,v.length);}}},
  tfClear(){ctx.tf={q:'',type:'',sort:ctx.tf?ctx.tf.sort:'power',shiny:false,dup:false,evo:false};modal('team');},
  auto(){autoTeam(S_);ctx.pend=null;G.teamUi();},
  bagUse(k){ctx.bagStone=k;modal('bag');},
  bagBack(){ctx.bagStone=null;modal('bag');},
  stoneOn(k,id){const l=useStone(S_,k,id);ctx.bagStone=null;if(l)ctx.bagMsg=l;modal('bag');head();save();if(l){const b=$('mbox');b.insertAdjacentHTML('afterbegin',`<div class="lines" style="margin-bottom:8px">${lineHtml(l)}</div>`);}}
};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('on')&&ctx.modalKind)G.close();});
$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&ctx.modalKind)G.close();});
view();
iconify(document.body);
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)iconify(n);else if(n.nodeType===3&&n.parentNode)iconify(n.parentNode);}}).observe(document.body,{childList:true,subtree:true});
</script>
</body>
