<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi aventura Pokémon</title>
<style>
:root{--bg:#0d1420;--panel:#152033;--panel2:#1c2a42;--line:#2a3b5a;--tx:#e8eef8;--mut:#8fa3c4;--acc:#ffcb3d;--good:#3fbf7f;--neu:#7b8aa3;--bad:#e5555d}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 600px at 50% -10%,#1b2c4a,#0d1420 62%) fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:12px 14px 48px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px}
.when{font-weight:700;font-size:15px}
.seasons{display:flex;align-items:center;gap:4px;margin-top:4px}
.se{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:8px;font-size:16px;background:var(--panel);border:1px solid var(--line);opacity:.35}
.se.done{opacity:.7;background:var(--panel2)}
.se.cur{opacity:1;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.tools{display:flex;gap:5px;margin-left:auto}
.ico{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:38px;height:36px;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ico img,.ico svg,.chip img,.chip svg,h3 img,h3 svg{image-rendering:pixelated;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--mut);white-space:nowrap}
.chip b{color:var(--tx)}
.chip.warn{border-color:var(--bad);color:#ffb3b7}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center}
.stat .n{font-size:18px;font-weight:800}
.stat .l{font-size:11px;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:20px;margin-bottom:6px}
.card p{color:#cfdaee}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.grid{display:grid;gap:8px}
.btn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 13px;font:inherit;cursor:pointer}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--acc);outline:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .t{font-weight:700}
.btn .d{font-size:13.5px;color:var(--mut);margin-top:2px}
.btn .why{font-size:12.5px;color:#f0a8ab;margin-top:3px}
.btn.primary{background:#b8222d;border-color:#d8343f;text-align:center;font-weight:700}
.btn.primary:hover:not(:disabled){background:#d8343f;border-color:#ff7a82}
.btn.armed{border-color:var(--bad);background:#3a1a22}
.btn.sm{padding:7px 10px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.odds{display:flex;height:20px;border-radius:6px;overflow:hidden;margin-top:8px;font-size:12px;font-weight:700;color:#07111d}
.odds span{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.odds .g{background:var(--good)}.odds .n{background:var(--neu)}.odds .b{background:var(--bad);color:#fff}
.mods{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.35}
.irrev{font-size:12.5px;color:#ffb3b7;margin-top:5px;font-weight:600}
.lines{display:grid;gap:4px;margin-top:10px}
.lines>div{background:var(--panel2);border-radius:8px;padding:6px 10px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.band{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.band.g{background:var(--good);color:#07111d}.band.n{background:var(--neu);color:#07111d}.band.b{background:var(--bad)}
.tp{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;color:#fff;margin-right:3px}
.sub{font-size:13px;color:var(--mut)}
.big{font-size:54px;text-align:center}
.center{text-align:center}
.mb{margin-bottom:8px}
.spr{image-rendering:pixelated;flex:none}
.fb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:11px;font-weight:800;flex:none}
#modal{position:fixed;inset:0;background:#050a12e8;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;max-width:560px}
#modal h3,.card h3{font-size:18px;margin-bottom:8px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px}
.dx{background:var(--panel2);border-radius:8px;padding:4px 6px;font-size:12px;min-height:74px;display:flex;flex-direction:column;align-items:center;text-align:center}
.dx.no{opacity:.4}
img.em{height:1.15em;width:auto;vertical-align:-.22em;image-rendering:pixelated}
.tp img{height:1.05em;width:1.05em;vertical-align:-.2em;margin-right:3px;image-rendering:auto}
.hero{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dx{cursor:pointer}
.tag-new{display:inline-block;background:#1fa35a;color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;letter-spacing:.3px}
.tag-own{display:inline-block;background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:0 6px;font-size:11px}
.dx .num{color:var(--mut);font-size:11px;align-self:flex-start}
.mon{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:6px 10px;margin-bottom:6px}
.mi{display:flex;align-items:center;gap:8px;min-width:0}
.mon .nm{font-weight:700}
.mon button{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px;flex:none}
.mon button:disabled{opacity:.4;cursor:not-allowed}
.logline{font-size:13.5px;color:#cfdaee;padding:3px 0;border-bottom:1px solid var(--line)}
.sec{margin:12px 0 6px;font-weight:700}
#wrap{display:flex;justify-content:center;align-items:flex-start;gap:16px;width:100%}
.side{display:none}
.mtop{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:flex-end;background:var(--panel);margin:-14px -14px 10px;padding:10px 14px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.mtop .btn{width:auto;display:inline-block}
.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.flt input[type=search],.flt select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 9px;font:inherit;font-size:13.5px;min-width:0}
.flt input[type=search]{flex:1 1 140px}
.fchip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.fchip.on{border-color:var(--acc);color:var(--tx);background:#2a3b5a}
.tchips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.tchips .tp{cursor:pointer;opacity:.5;border:2px solid transparent}
.tchips .tp.on{opacity:1;border-color:#fff}
.pend{background:#3a2f12;border:1px solid var(--acc);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.side .card{padding:10px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:5px 8px;margin-bottom:6px}
.slot .nm{font-weight:700;font-size:14px;line-height:1.2}
.slot .sub{font-size:12px}
.slot button{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:3px 8px;cursor:pointer;font:inherit;font-size:12px;flex:none}
.slot.empty{border:1px dashed var(--line);background:transparent;color:var(--mut);font-size:13px;min-height:46px}
.side h3{font-size:16px;margin-bottom:8px}
.bagit{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid var(--line);font-size:13px}
.bagit .nm{font-weight:700;font-size:13.5px}
.bagit button{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:3px 8px;cursor:pointer;font:inherit;font-size:12px}
@media (min-width:1100px){
 body{display:block}
 #wrap{max-width:1560px;margin:0 auto;padding:0 18px}
 #app{max-width:760px;zoom:1.12;flex:1 1 auto}
 .side{display:block;width:310px;flex:none;position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto;padding:12px 0 24px}
 #modal .box{max-width:820px}
}
@media (min-width:1500px){#app{zoom:1.22;max-width:800px}.side{width:340px}}
.rbar{position:relative;display:flex;height:26px;border-radius:8px;overflow:visible;margin:6px 0 14px;font-size:12px;font-weight:800;color:#07111d;cursor:pointer}
.rbar span{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.rbar .g{background:var(--good);border-radius:8px 0 0 8px}.rbar .n{background:var(--neu)}.rbar .b{background:var(--bad);color:#fff;border-radius:0 8px 8px 0}
.rbar .rmark{position:absolute;top:-7px;bottom:-7px;width:4px;margin-left:-2px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff,0 0 0 1px #000a;pointer-events:none}
.rhide{opacity:0;pointer-events:none}
.rshow{animation:rfade .45s ease both}
@keyframes rfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rsub{font-size:12px;color:var(--mut);text-align:center;margin-top:-8px;margin-bottom:8px}
.slotrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}.slotrow .del{width:auto;text-align:center;display:flex;align-items:center}
.hofrow{display:flex;flex-direction:column;gap:4px;background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.hofteam{display:flex;gap:2px;flex-wrap:wrap}
.gd{background:var(--panel2);border-radius:10px;margin-bottom:6px;padding:0 10px}.gd summary{cursor:pointer;padding:9px 0;font-weight:700}.gd .gb{padding:0 0 10px;font-size:14px;color:#cfdaee}.gd .gb ul{padding-left:18px;margin:4px 0 8px}.gd .gb li{margin-bottom:5px}.gd .gb p{margin:6px 0}
@media (max-width:380px){.stat .n{font-size:16px}.chip{font-size:12px}.se{width:26px}}
</style>
</head>

<aside class="side" id="sideL"></aside>

  <div class="stats" id="stats"></div>
  <div id="main" class="grid"></div>
</div>
<aside class="side" id="sideR"></aside>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>

function setRng(f){R=f;}

const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');
const MON=POKE.map(p=>({n:p[0],name:p[1],types:p[2],bst:p[3],evo:p[4]}));
const BYN=new Map(MON.map(m=>[norm(m.name),m.n]));
const mon=n=>MON[n-1];
const num=name=>{const n=BYN.get(norm(name));if(!n)throw new Error('Pokémon desconocido: '+name);return n;};
const tier=n=>{const b=mon(n).bst;return b<=330?0:b<=430?1:b<=500?2:3;};
function wpick(items,wf){let tot=0;for(const it of items)tot+=wf(it);let r=R()*tot;for(const it of items){r-=wf(it);if(r<=0)return it;}return items[items.length-1];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function giveItem(s,k,n){
  n=n||1;
  if(ITEMS[k].stone){s.items[k]=(s.items[k]||0)+n;return true;}
  if(s.items[k])return false;s.items[k]=1;return true;
}
function loseItem(s){
  const keys=Object.keys(s.items).filter(k=>k!=='shiny_charm'&&k!=='pase_libre'&&s.items[k]>0);
  if(!keys.length)return null;
  const k=keys[Math.floor(R()*keys.length)];
  s.items[k]--;if(s.items[k]<=0)delete s.items[k];
  return k;
}

function newGame(originId,starterName){
  const o=ORIGINS.find(x=>x.id===originId);
  const s={t:0,origin:originId,st:{valor:2,ingenio:2,carisma:2,cuidado:2,sigilo:2},voc:null,
    prac:{},box:[],team:[],nextId:1,dex:{},shinyDex:{},items:{},badges:[],gymRetry:{},leagueFails:0,leagueWon:false,
    rep:0,moral:0,heat:0,rocket:false,rocketPts:0,gymOwner:false,gymType:null,fame:0,studied:0,studyYears:0,
    rp:0,pubs:0,forcedEnd:null,
    flags:{},seen:{},recent:[],pity:0,pendingTime:0,counters:{},log:[],ending:null};
  for(const k in o.st)s.st[k]+=o.st[k];
  if(o.rep)s.rep=o.rep;
  s.starter=num(starterName);
  addMon(s,num(starterName),false);
  addMon(s,num(o.mon),false);
  if(o.item)giveItem(s,o.item,1);
  if(o.familia)s.flags.rocketSeen=true; // el Equipo Rocket ya te conoce: las ofertas llegan antes y más seguido
  return s;
}
const dexN=s=>Object.keys(s.dex).length;
const shinyN=s=>Object.keys(s.shinyDex).length;
const pw=m=>Math.round(mon(m.sp).bst*m.q);
const talent=m=>Math.round((m.q-1)*100);
function addMonX(s,sp,shiny){
  const m={id:s.nextId++,sp,shiny:!!shiny,q:Math.round((0.9+0.2*R())*100)/100};
  s.box.push(m);s.dex[sp]=1;if(shiny)s.shinyDex[sp]=1;
  let up=false;
  const cur=teamMons(s).find(x=>x.sp===sp&&x.id!==m.id);
  if(cur){if(pw(m)>pw(cur)&&(m.shiny||!cur.shiny)){s.team=s.team.map(id=>id===cur.id?m.id:id);up=true;}} // un shiny en el equipo no lo desplaza uno normal
  else if(s.team.length<6)s.team.push(m.id);
  return {m,up};
}
const addMon=(s,sp,shiny)=>addMonX(s,sp,shiny).m;
const teamMons=s=>s.team.map(id=>s.box.find(m=>m.id===id)).filter(Boolean);
function teamTypes(s){const c={};for(const m of teamMons(s))for(const t of mon(m.sp).types)c[t]=(c[t]||0)+1;return c;}
const XP_CAP=45,XP_TRAIN=3;
const xpOf=m=>m.xp||0;
function addXp(s,n,all){const ids=all?s.team:s.team;for(const m of teamMons(s))m.xp=Math.min(XP_CAP,xpOf(m)+n);}
function teamPower(s){const t=teamMons(s);return t.length?t.reduce((a,m)=>a+pw(m)+xpOf(m),0)/t.length:0;}

function repGifts(s){ // a las 5, 10 y 15 de reputación la gente te hace un regalo (una sola vez cada uno)
  const L=[];
  for(const at of REP_GIFTS){
    const f='repg'+at;if(s.rep<at||s.flags[f])continue;s.flags[f]=true;
    if(at===5){const useful=STONE_KEYS.filter(k=>stoneTargets(s,k).length>0);const pool=useful.length?useful:STONE_KEYS;const k=pool[Math.floor(R()*pool.length)];giveItem(s,k,1);L.push('🎁 La gente del pueblo te regala una '+ITEMS[k].name+': «Gracias por todo lo que hacés».');}
    else if(at===10){L.push('🎁 Los vecinos te traen un Pokémon como agradecimiento:');L.push(giveWild(s));}
    else{if(giveItem(s,'lucky_charm',1))L.push('🎁 Toda la región te conoce. Te regalan el Amuleto de la Suerte.');else{giveItem(s,STONE_KEYS[Math.floor(R()*STONE_KEYS.length)],1);L.push('🎁 Toda la región te conoce. Te regalan una piedra evolutiva.');}}
  }
  return L;
}

// ----- colección: un ejemplar visible por especie (el mejor) -----
function stacks(s){ // un grupo por especie y por variante (los shiny van aparte de los normales)
  const g=new Map();
  for(const m of s.box){const k=m.sp+(m.shiny?'s':'n');let e=g.get(k);if(!e){e={sp:m.sp,shiny:!!m.shiny,count:0,best:m};g.set(k,e);}e.count++;if(pw(m)>pw(e.best))e.best=m;}
  return [...g.values()].sort((a,b)=>a.sp-b.sp||a.shiny-b.shiny);
}
function bestOf(s,sp){let b=null;for(const m of s.box)if(m.sp===sp&&(!b||pw(m)>pw(b)))b=m;return b;}
function autoTeam(s){ // el mejor ejemplar de cada especie (normal o shiny, el que más poder tenga)
  const by=new Map();for(const e of stacks(s)){const c=by.get(e.sp);if(!c||pw(e.best)>pw(c))by.set(e.sp,e.best);}
  s.team=[...by.values()].sort((a,b)=>pw(b)-pw(a)).slice(0,6).map(m=>m.id);
}
function normalizeTeam(s){
  const seen=new Map();
  for(const id of s.team){const m=s.box.find(x=>x.id===id);if(!m)continue;const c=seen.get(m.sp);if(!c||pw(m)>pw(c))seen.set(m.sp,m);}
  s.team=[...seen.values()].map(m=>m.id).slice(0,6);
  if(!s.team.length)autoTeam(s);
}
function teamAdd(s,sp){
  if(s.team.length>=6)return false;
  if(teamMons(s).some(m=>m.sp===sp))return false;
  const b=bestOf(s,sp);if(!b)return false;s.team.push(b.id);return true;
}
function teamAddMon(s,id){ // pone a ese ejemplar en el equipo; si ya había otro de la misma especie, lo reemplaza
  const m=s.box.find(x=>x.id===id);if(!m)return false;
  const cur=teamMons(s).find(x=>x.sp===m.sp);
  if(cur){s.team=s.team.map(i=>i===cur.id?m.id:i);return true;}
  if(s.team.length>=6)return false;s.team.push(m.id);return true;
}
function teamRemove(s,id){if(s.team.length<=1)return false;s.team=s.team.filter(x=>x!==id);return true;}
function loseOne(s){
  if(s.box.length<=1)return null;
  const tm=teamMons(s);
  const rest=s.box.filter(m=>!s.team.includes(m.id));
  const pool=(R()<0.6&&tm.length>1)||!rest.length?tm:rest;
  const m=pool[Math.floor(R()*pool.length)];
  s.box=s.box.filter(x=>x.id!==m.id);s.team=s.team.filter(id=>id!==m.id);
  normalizeTeam(s);
  return m;
}
function evolveMon(s,m,to){
  m.sp=to;s.dex[to]=1;if(m.shiny)s.shinyDex[to]=1;
  normalizeTeam(s);
}

// ---------- Captura ----------
// Los legendarios piden medallas (3er valor de la entrada); un Coleccionista con 100+ especies también puede cruzarse con ellos
const legendOk=(s,x)=>!x[2]||s.badges.length>=x[2]||(s.voc==='coleccionista'&&dexN(s)>=100);
const zoneList=(s,z)=>z.list.filter(x=>legendOk(s,x));
function rollEncounter(s,z){
  const rm=(s.items.incienso?1.5:1)*(s.voc==='coleccionista'?1.25:1)*(1+0.15*Math.min(s.pity,10));
  const e=wpick(zoneList(s,z),x=>(x[1]<=8?x[1]*rm:x[1])*(s.dex[num(x[0])]?0.25:1));
  if(e[1]<=8)s.pity=0;else s.pity++;
  return {sp:num(e[0]),w:e[1]};
}
function catchP(s,enc){
  const p=0.62+0.025*s.st.cuidado+0.015*s.st.carisma-0.07*tier(enc.sp)-(enc.w<=4?0.06:0)+(s.items.lucky_charm?0.03:0)+(s.voc==='coleccionista'?0.04:0);
  return clamp(p,0.15,0.95);
}
const CAVES=['moon','heladas','celeste'];
const encN=s=>7+(s.items.lupa?1:0)+(s.voc==='coleccionista'?4:0)+Math.floor(s.st.cuidado/6);
function explore(s,zoneId){
  const z=ZONES.find(x=>x.id===zoneId);
  const n=encN(s)+(s.items.piedra_dura&&CAVES.includes(zoneId)?2:0);
  const lines=[{t:`Exploraste: ${z.name} (${n} encuentros)`}];
  const lost=[];let any=false;
  for(let i=0;i<n;i++){
    const enc=rollEncounter(s,z);
    if(R()<catchP(s,enc)){
      const shiny=R()<shinyChance(s);
      const had=s.box.filter(x=>x.sp===enc.sp);
      const isNew=!s.dex[enc.sp];
      const {m,up}=addMonX(s,enc.sp,shiny);
      any=true;
      let tag='';
      if(isNew)tag=' · ¡nuevo en la Pokédex!';
      else if(up)tag=' · ¡mejor ejemplar! Pasa al equipo';
      else if(pw(m)>Math.max(...had.map(pw)))tag=' · mejor ejemplar';
      else tag=' · repetido';
      lines.push({t:`${shiny?'✨ ¡SHINY! ':''}${mon(enc.sp).name} (poder ${pw(m)})${tag}${enc.w<=8&&!shiny?' · raro':''}`,sp:enc.sp,sh:shiny});
    }else lost.push(mon(enc.sp).name);
  }
  if(!any)lines.push({t:'No lograste capturar ninguno esta vez.'});
  if(lost.length)lines.push({t:'Se escaparon: '+lost.join(', ')});
  const sp=0.2+(s.voc==='coleccionista'?0.04:0)+(s.items.lupa?0.03:0)+(s.items.piedra_dura?0.10:0);
  if(R()<sp){const k=ZSTONE[zoneId][Math.floor(R()*ZSTONE[zoneId].length)];giveItem(s,k,1);lines.push({t:'Encontraste una '+ITEMS[k].name,item:k});}
  return {title:'Explorar: '+z.name,lines,seasons:1};
}
function giveFromZone(s,zid){const z=ZONES.find(x=>x.id===zid);const enc=rollEncounter(s,z);return giveMon(s,enc.sp);}
function giveHaul(s,zid,n,rare){
  const open=ZONES.filter(z=>zoneOpen(s,z)&&(powerOnly(s)||z.need<=Math.max(0,s.badges.length)));
  const z=zid?ZONES.find(x=>x.id===zid):(open.length?open[Math.floor(R()*open.length)]:ZONES[0]);
  const out=[];
  for(let i=0;i<n;i++){
    let enc=null;
    for(let t=0;t<40;t++){const e=rollEncounter(s,z);if(rare?(e.w<=5&&!LEGEND.has(e.sp)):(e.w>8)){enc=e;break;}}
    if(!enc){enc=rollEncounter(s,z);}
    out.push(giveMon(s,enc.sp));
  }
  return out;
}
function giveWild(s){
  const open=ZONES.filter(z=>zoneOpen(s,z)&&(powerOnly(s)||z.need<=Math.max(0,s.badges.length)));
  const z=open.length?open[Math.floor(R()*open.length)]:ZONES[0];
  return giveFromZone(s,z.id);
}
function giveMon(s,sp){
  const shiny=R()<shinyChance(s);const isNew=!s.dex[sp];
  const {m,up}=addMonX(s,sp,shiny);
  return {t:`${shiny?'✨ ¡SHINY! ':'🎁 '}Se suma ${mon(sp).name} (poder ${pw(m)})${isNew?' · ¡nuevo en la Pokédex!':up?' · ¡mejor ejemplar!':''}`,sp,sh:shiny};
}

const shipOpen=s=>!!s.items.ss_ticket&&(s.badges.length>=3||teamPower(s)>=SHIP_PW);
function shipRun(s){
  s.counters.shipDone=1;
  const lines=[{t:'Embarcaste en el barco: te espera un año de viaje con combates y regalos.'}];let wins=0;
  const stoneLine=(why)=>{const useful=STONE_KEYS.filter(k=>stoneTargets(s,k).length>0);const pool=useful.length?useful:STONE_KEYS;const k=pool[Math.floor(R()*pool.length)];giveItem(s,k,1);return {t:why+': '+ITEMS[k].name,item:k};};
  SHIP_FOES.forEach((f,i)=>{
    const pv=gymPreview(s,{id:'ship'+i,team:f.team,pw:f.pw});
    const ace=num(f.team[f.team.length-1]);
    if(R()*100<pv.win){wins++;addXp(s,6);lines.push({t:`Combate ${i+1}: le ganaste a ${f.n} (chance ${pv.win}%). +6 de entrenamiento al equipo.`,sp:ace});

const evoLvl=m=>mon(m.sp).evo.some(e=>e[1]==='l');
// Entrenar. Sin argumento: entrenamiento automático (todo el equipo + hasta 8 que evolucionan por nivel).
// Con una lista de ids: entrenamiento específico (solo esos, hasta 6, estén o no en el equipo).
function train(s,ids){
  const chance=clamp(0.40+0.02*s.st.cuidado,0.40,0.65);
  const lines=[];let evolved=0;
  const specific=Array.isArray(ids)&&ids.length>0;
  let trained=[],cand=[];
  if(specific){
    trained=ids.slice(0,6).map(id=>s.box.find(x=>x.id===id)).filter(Boolean);
    cand=trained.filter(evoLvl);
    s.trainSel=trained.map(m=>m.id);
    lines.push({t:'🎯 Entrenamiento específico: '+trained.map(nameOf).join(', ')});
  }else{
    const bySp=new Map();
    for(const m of s.box){
      if(!evoLvl(m))continue;
      const c=bySp.get(m.sp);
      const better=!c||(s.team.includes(m.id)&&!s.team.includes(c.id))||(s.team.includes(m.id)===s.team.includes(c.id)&&pw(m)>pw(c));
      if(better)bySp.set(m.sp,m);
    }
    const all=shuffle([...bySp.values()]);
    const inT=m=>s.team.includes(m.id);
    cand=all.filter(inT).concat(all.filter(m=>!inT(m))).slice(0,8); // primero el equipo, después el banco al azar
    if(cand.length)lines.push({t:'🎯 Entrenaron: '+cand.map(nameOf).join(', ')});
  }
  for(const m of cand){
    if(R()<chance){
      const ev=mon(m.sp).evo.filter(e=>e[1]==='l');
      const to=ev[Math.floor(R()*ev.length)][0];
      const from=mon(m.sp).name;const isNew=!s.dex[to];
      evolveMon(s,m,to);
      lines.push({t:`⭐ ¡${from} evolucionó a ${mon(to).name}!${isNew?' · nuevo en la Pokédex':''}`,sp:to,sh:m.shiny});evolved++;
    }
  }
  if(!evolved)lines.push('Entrenaron duro, pero ninguno evolucionó esta vez.');
  if(specific){
    let gained=0;
    for(const m of trained){const o=xpOf(m);m.xp=Math.min(XP_CAP,o+XP_TRAIN);if(m.xp>o)gained++;}
    lines.push({t:gained?`💪 ${gained} ${gained===1?'Pokémon ganó':'Pokémon ganaron'} +${XP_TRAIN} de poder de entrenamiento`:'💪 Los Pokémon elegidos ya llegaron al tope de entrenamiento.'});
  }else{
    const before=Math.round(teamPower(s));addXp(s,XP_TRAIN);const after=Math.round(teamPower(s));
    if(after>before)lines.push({t:`💪 Tu equipo se hizo más fuerte con el entrenamiento (poder ${before} → ${after})`});else lines.push({t:'💪 Tu equipo ya no puede mejorar más solo entrenando: llegó al tope de entrenamiento.'});
  }
  return {title:'Entrenar',lines,seasons:1};
}
function studyRun(s,years,stat){
  const g=years===1?3:6;const lines=[];
  const old=s.st[stat];s.st[stat]=clamp(old+g,1,STAT_CAP);lines.push(`+${s.st[stat]-old} ${SL[stat]} (ahora ${s.st[stat]})`);
  if(years===2&&s.st.ingenio<STAT_CAP){s.st.ingenio++;lines.push('+1 Ingenio');}
  if(s.voc==='profesor'&&s.st[stat]<STAT_CAP){s.st[stat]++;lines.push('+1 '+SL[stat]+' por tu vocación');}
  s.studied++;s.studyYears+=years;
  lines.unshift(years===1?'Pasaste un año en la academia.':'Pasaste dos años en la academia.');
  return {title:'Academia ('+years+(years===1?' año)':' años)'),lines,seasons:years*4};
}

// ---------- Piedras y mercado ----------
function stoneTargets(s,key){
  const seen=new Map();
  for(const m of s.box){
    const ev=mon(m.sp).evo.find(e=>e[1]==='s'&&e[2]===key);if(!ev)continue;
    const c=seen.get(m.sp);if(!c||pw(m)>pw(c))seen.set(m.sp,m);
  }
  return [...seen.values()];
}
function useStone(s,key,monId){
  if(!(s.items[key]>0))return null;
  const m=s.box.find(x=>x.id===monId);
  const ev=m&&mon(m.sp).evo.find(e=>e[1]==='s'&&e[2]===key);
  if(!ev)return null;
  s.items[key]--;if(!s.items[key])delete s.items[key];
  const from=mon(m.sp).name;const isNew=!s.dex[ev[0]];
  evolveMon(s,m,ev[0]);
  return {t:`⭐ ${from} evoluciona a ${mon(ev[0]).name}${isNew?' · ¡nuevo en la Pokédex!':''}`,sp:ev[0],sh:m.shiny};
}
function dupes(s){ // copias que no son la mejor de su especie, ni shiny ni del equipo
  const by={};for(const m of s.box)(by[m.sp]=by[m.sp]||[]).push(m);
  const out=[];
  for(const sp in by){const arr=by[sp].sort((a,b)=>pw(b)-pw(a));for(const m of arr.slice(1))if(!m.shiny&&!s.team.includes(m.id))out.push(m);}
  return out;
}
function dupeStacks(s){
  const g=new Map();
  for(const m of dupes(s)){let e=g.get(m.sp);if(!e){e={sp:m.sp,count:0,weakest:m};g.set(m.sp,e);}e.count++;if(pw(m)<pw(e.weakest))e.weakest=m;}
  return [...g.values()].sort((a,b)=>a.sp-b.sp);
}
function tradeEvos(s){
  const seen=new Map();
  for(const m of s.box){if(!mon(m.sp).evo.some(e=>e[1]==='t'))continue;const c=seen.get(m.sp);if(!c||pw(m)>pw(c))seen.set(m.sp,m);}
  return [...seen.values()];
}
const marketOk=s=>dupes(s).length>0||stoneCount(s)>0||tradeEvos(s).length>0;
const MK_LIMITS={swaps:3,trades:2,evos:2};
const mkL=s=>({swaps:MK_LIMITS.swaps+(s.items.pepita?1:0),trades:MK_LIMITS.trades+(s.items.pepita?1:0),evos:MK_LIMITS.evos});
function tradeCandidates(s,m){
  const L=[];
  for(const t of MON){if(tradeOk(m,t.n))L.push(t.n);}
  const fresh=shuffle(L.filter(n=>!s.dex[n])),old=shuffle(L.filter(n=>s.dex[n]));
  return fresh.slice(0,3).concat(old.slice(0,fresh.length?1:3));
}
// Regla del trato (determinística): otra especie, no legendaria, con poder base dentro de ±15% del ejemplar que entregás.
function tradeOk(m,toSp){
  const t=MON[toSp-1];if(!t||toSp===m.sp||LEGEND.has(toSp))return false;
  const base=pw(m);return Math.abs(t.bst-base)/base<=0.15;
}
function doTrade(s,monId,toSp){
  const m=s.box.find(x=>x.id===monId);if(!m)return null;
  if(!tradeOk(m,toSp))return null;
  const r=swapMon(s,monId,toSp);if(r)s.counters.mkv=(s.counters.mkv||0)+1;
  return r;
}
function swapMon(s,monId,toSp){
  const m=s.box.find(x=>x.id===monId);if(!m)return null;
  const from=mon(m.sp).name;
  s.box=s.box.filter(x=>x.id!==m.id);s.team=s.team.filter(x=>x!==m.id);
  const isNew=!s.dex[toSp];
  const {m:nm}=addMonX(s,toSp,false);
  normalizeTeam(s);
  return {t:`🔄 Cambiaste un ${from} repetido por ${mon(toSp).name} (poder ${pw(nm)})${isNew?' · ¡nuevo en la Pokédex!':''}`,sp:toSp,sh:false};
}
function swapForStone(s,monId,key){
  const m=s.box.find(x=>x.id===monId);if(!m)return null;
  const from=mon(m.sp).name;
  s.box=s.box.filter(x=>x.id!==m.id);s.team=s.team.filter(x=>x!==m.id);
  normalizeTeam(s);giveItem(s,key,1);
  return {t:`🔄 Cambiaste un ${from} repetido por 1 ${ITEMS[key].name}`};
}
// Ofertas de intercambio en eventos: fijas y visibles. Se acepta o se rechaza, sin azar.
function buildTrade(s,e){
  const ds=dupes(s);if(!ds.length)return null;
  const g=ds[Math.floor(R()*ds.length)];
  const gname=mon(g.sp).name+' repetido (poder '+pw(g)+')';
  let what,fx;
  if(e.trade==='mon'){
    const c=tradeCandidates(s,g);if(!c.length)return null;
    const to=c[0];
    what=mon(to).name+' (poder base '+mon(to).bst+')'+(s.dex[to]?'':' · ¡nuevo en tu Pokédex!');
    fx={trade:{give:g.id,get:to},rocketPts:2};
  }else{
    const useful=STONE_KEYS.filter(k=>stoneTargets(s,k).length>0);
    const pool=useful.length?useful:STONE_KEYS;
    const k=pool[Math.floor(R()*pool.length)];
    what='una '+ITEMS[k].name;fx={tradeStone:{give:g.id,key:k},rocketPts:2};
  }
  return Object.assign({},e,{
    text:()=>e.pre+' Te ofrece '+what+' a cambio de tu '+gname+'.',
    opts:[S('Aceptar el cambio','Cerrás el trato y los dos quedan conformes.',fx),S('Rechazar','Cada uno sigue su camino.',{})]});
}
function tradeEvolve(s,monId){
  const m=s.box.find(x=>x.id===monId);const ev=m&&mon(m.sp).evo.find(e=>e[1]==='t');
  if(!ev)return null;
  s.counters.mkv=(s.counters.mkv||0)+1;
  const from=mon(m.sp).name;const isNew=!s.dex[ev[0]];
  evolveMon(s,m,ev[0]);
  return {t:`🔄 ${from} evoluciona por intercambio a ${mon(ev[0]).name}${isNew?' · ¡nuevo en la Pokédex!':''}`,sp:ev[0],sh:m.shiny};
}
function swapStone(s,a,b){
  if(a===b||!(s.items[a]>0)||!ITEMS[b]||!ITEMS[b].stone)return null;
  s.counters.mkv=(s.counters.mkv||0)+1;
  s.items[a]--;if(!s.items[a])delete s.items[a];giveItem(s,b,1);
  return {t:`🔄 Cambiaste 1 ${ITEMS[a].name} por 1 ${ITEMS[b].name}`};
}

// ---------- Probabilidades de eventos ----------
function shiftOdds(base,d){
  let [g,n,b]=base;
  if(d>=0){const a=Math.min(d,Math.max(0,b-2));b-=a;g+=a;const r=d-a;const c=Math.min(r,Math.max(0,n-2));n-=c;g+=c;}
  else{d=-d;const a=Math.min(d,Math.max(0,g-2));g-=a;b+=a;const r=d-a;const c=Math.min(r,Math.max(0,n-2));n-=c;b+=c;}
  return [g,n,b];
}
function modList(s,opt){
  const L=[];
  for(const m of opt.mods||[]){
    const k=m[0];
    if(k==='s'){const v=clamp(m[2]*(s.st[m[1]]-4),-10,14);if(v)L.push([SL[m[1]]+' '+s.st[m[1]],v]);}
    else if(k==='c'){const v=clamp(m[3]*(s.st[m[1]]-m[2]),-20,14);if(v)L.push([SL[m[1]]+' '+s.st[m[1]]+' (exige '+m[2]+')',v]);}
    else if(k==='t'){const tc=teamTypes(s);let c=0;for(const t of m[1])c+=tc[t]||0;c=Math.min(c,2);if(c)L.push(['Equipo con tipo '+m[1].map(t=>TES[t]).join('/'),m[2]*c]);}
    else if(k==='p'){const v=clamp((teamPower(s)-350)*m[1]/20,-10,15);L.push(['Poder del equipo',v]);}
    else if(k==='i'){if(s.items[m[1]])L.push([ITEMS[m[1]].name,m[2]]);}
    else if(k==='f'){if(s.flags[m[1]])L.push([m[3]||m[1],m[2]]);}
    else if(k==='v'){if(s.voc===m[1])L.push(['Vocación: '+VOCS[m[1]].name,m[2]]);}
    else if(k==='sp'){if(teamMons(s).some(x=>mon(x.sp).name===m[1]))L.push([m[1]+' en el equipo',m[2]]);}
    else if(k==='dup'){const n=dupes(s).length;const v=Math.min(8,n*m[1]*0.5);if(v>=1)L.push(['Muestras repetidas ('+n+')',v]);}
    else if(k==='r'){const v=repMod(s);if(v)L.push(['Reputación '+s.rep+' ('+repRank(s)+')',v]);}
    else if(k==='dex'){const v=Math.min(12,Math.floor(dexN(s)/10)*m[1]);if(v)L.push(['Pokédex '+dexN(s),v]);}
  }
  if(s.items.corona&&!opt.sure&&(opt.mods||[]).some(m=>m[0]==='r'))L.push(['Corona de la familia',3]);
  if(s.items.lucky_charm&&!opt.sure)L.push(['Amuleto de la Suerte',5]);
  return L.map(x=>[x[0],Math.round(x[1])]).filter(x=>x[1]!==0);
}
function oddsFor(s,opt){
  const mods=modList(s,opt);let d=mods.reduce((a,x)=>a+x[1],0);
  if(!opt.sure&&d<DMIN){mods.push(['Límite de penalización (nunca más de '+(-DMIN)+' puntos en contra)',DMIN-d]);d=DMIN;}
  return {p:opt.sure?[100,0,0]:shiftOdds(opt.base,d),mods,d};
}
let lastRoll=0;
function rollBand(p){const r=R()*100;lastRoll=r;return r<p[0]?'g':r<p[0]+p[1]?'n':'b';}

// ---------- Efectos ----------
function applyFx(s,fx){
  const L=[];
  if(fx.voc){
    const v=VOCS[fx.voc];s.voc=fx.voc;
    for(const k in v.st){s.st[k]=clamp(s.st[k]+v.st[k],1,STAT_CAP);L.push('+'+v.st[k]+' '+SL[k]);}
  }
  if(fx.st)for(const k in fx.st){const o=s.st[k];s.st[k]=clamp(o+fx.st[k],1,STAT_CAP);if(s.st[k]!==o)L.push((s.st[k]>o?'+':'')+(s.st[k]-o)+' '+SL[k]);}
  if(fx.rep){s.rep=clamp(s.rep+fx.rep,-10,20);L.push((fx.rep>0?'⭐ +':'⭐ ')+fx.rep+' Reputación (ahora '+s.rep+' · '+repRank(s)+')');if(fx.rep>0)L.push(...repGifts(s));}
  if(fx.moral){s.moral=clamp(s.moral+fx.moral,-10,10);L.push(fx.moral>0?'Tu conciencia está más tranquila':'Tu conciencia pesa un poco más');}
  if(fx.heat){s.heat=Math.max(0,s.heat+fx.heat);L.push(fx.heat>0?'🚨 La policía te tiene más en la mira (Heat '+s.heat+'/5)':'Heat baja a '+s.heat+'/5');}
  if(fx.rocketPts){s.rocketPts=clamp(s.rocketPts+fx.rocketPts,0,ROCKET_MAX);L.push('Rango Rocket: '+rocketRank(s)+' ('+s.rocketPts+'/'+ROCKET_MAX+')');}
  if(fx.fame){s.fame=Math.max(0,s.fame+fx.fame);L.push((fx.fame>0?'+':'')+fx.fame+' Fama del gimnasio ('+s.fame+'/'+FAME_MAX+')');}
  if(fx.rp){s.rp=Math.max(0,s.rp+fx.rp);L.push('🔬 '+(fx.rp>0?'+':'')+fx.rp+' puntos de investigación ('+s.rp+')');}
  if(fx.pub){s.pubs+=1;L.push('📄 Publicación '+s.pubs+'/3');}
  if(fx.gain)for(const n of fx.gain)L.push(giveMon(s,num(n)));
  if(fx.gainPick){const names=fx.gainPick;const fresh=names.filter(n=>!s.dex[num(n)]);const pool=fresh.length?fresh:names;L.push(giveMon(s,num(pool[Math.floor(R()*pool.length)])));}
  if(fx.gainWild)for(let i=0;i<fx.gainWild;i++)L.push(giveWild(s));
  if(fx.gainZone)L.push(giveFromZone(s,fx.gainZone));
  if(fx.haul)L.push(...giveHaul(s,fx.haul.zone,fx.haul.n,!!fx.haul.rare));
  if(fx.trade){const l=swapMon(s,fx.trade.give,fx.trade.get);if(l)L.push(l);}
  if(fx.tradeStone){const l=swapForStone(s,fx.tradeStone.give,fx.tradeStone.key);if(l)L.push(l);}
  if(fx.stone)for(let i=0;i<fx.stone;i++){const k=STONE_KEYS[Math.floor(R()*STONE_KEYS.length)];giveItem(s,k,1);L.push({t:'Conseguiste: '+ITEMS[k].name,item:k});}
  if(fx.item){if(giveItem(s,fx.item,1))L.push({t:'Conseguiste: '+ITEMS[fx.item].name+' ('+ITEMS[fx.item].desc+')',item:fx.item});}
  if(fx.flag)Object.assign(s.flags,fx.flag);
  if(fx.inc)for(const k in fx.inc)s.counters[k]=(s.counters[k]||0)+fx.inc[k];
  if(fx.loseItem){
    const k=loseItem(s);
    if(k)L.push({t:'💔 Perdiste: '+ITEMS[k].name,item:k});
    else{s.rep=clamp(s.rep-1,-10,20);L.push('No tenías nada que perder, pero tu reputación se resiente (-1)');}
  }
  if(fx.loseMon){const m=loseOne(s);if(m)L.push('💔 Perdiste a '+mon(m.sp).name);}
  if(fx.time){s.pendingTime+=fx.time;L.push('⏳ Perdés '+fx.time+(fx.time===1?' estación':' estaciones')+' recuperándote');}
  if(fx.commit==='rocket'){s.rocket=true;s.rocketPts=1;L.push('🅡 Ahora sos parte del Equipo Rocket. Gimnasios y Liga quedan fuera de tu alcance.');}
  if(fx.commit==='gymowner'){s.gymOwner=true;s.gymType=topBoxType(s).type||'Normal';L.push('🏟️ Fundaste tu gimnasio de tipo '+TES[s.gymType]+'. Gimnasios y Liga quedan atrás.');}
  if(fx.end){s.forcedEnd=fx.end;}
  return L;
}

// ---------- Gimnasios ----------
function gymPreview(s,gym){
  const mons=teamMons(s);const opps=gym.team.map(num);
  let cov=0,weak=0;
  for(const o of opps){
    const ot=mon(o).types;let best=0;
    for(const m of mons)for(const t of mon(m.sp).types){let v=1;for(const d of ot)v*=EFF[t][d];if(v>best)best=v;}
    cov+=best;
    let w=0;
    for(const m of mons){const mt=mon(m.sp).types;let inc=0;for(const a of ot){let v=1;for(const d of mt)v*=EFF[a][d];if(v>inc)inc=v;}if(inc>=2)w++;}
    weak+=mons.length?w/mons.length:0;
  }
  cov/=opps.length;weak/=opps.length;
  const oppPower=gym.pw||(opps.reduce((a,n)=>a+mon(n).bst,0)/opps.length+gym.off+PW_ADJ);
  const tp=teamPower(s);
  const parts=[];
  parts.push(['Ventaja de tipos (cobertura '+cov.toFixed(1)+'x)',clamp((cov-1)*10,-8,10)]);
  parts.push(['Debilidades de tu equipo',-weak*10]);
  parts.push(['Poder del equipo ('+Math.round(tp)+') vs rival ('+Math.round(oppPower)+')',clamp((tp-oppPower)*0.40,-60,30)]);
  parts.push(['Tamaño del equipo ('+mons.length+')',clamp(mons.length*1.5-4.5,-4.5,4.5)]);
  parts.push(['Valor '+s.st.valor,clamp((s.st.valor-4)*0.6,-5,8)]);
  if(s.items.lucky_charm)parts.push(['Amuleto de la Suerte',3]);
  if(s.voc==='campeon')parts.push(['Vocación: Campeón',3]);
  const retry=(s.gymRetry[gym.id]||0);if(retry)parts.push(['Experiencia de intentos anteriores',retry]);
  let tot=40;for(const p of parts)tot+=p[1];
  return {win:clamp(Math.round(tot),5,95),parts:parts.map(p=>[p[0],Math.round(p[1])]),cov,weak,tp,oppPower};
}
function gymRun(s){
  const gym=GYMS[s.badges.length];const pv=gymPreview(s,gym);
  const band=rollBand([pv.win,0,100-pv.win]); // sin grises: o ganás o perdés
  const lines=[];
  if(band==='g'){
    s.badges.push(gym.id);delete s.gymRetry[gym.id];addXp(s,1);
    lines.push({t:`¡Derrotaste a ${gym.leader}! Conseguís la medalla ${s.badges.length}/8.`,sp:aceNum(gym),badge:s.badges.length-1});
    lines.push(...applyFx(s,{rep:1,st:{valor:1}}));
  }else{
    s.counters.gymLoss=(s.counters.gymLoss||0)+1;
    s.gymRetry[gym.id]=Math.min(10,(s.gymRetry[gym.id]||0)+3);
    lines.push(`${gym.leader} te derrotó. Aprendiste su estilo (+3% la próxima vez).`);
    lines.push(...applyFx(s,{rep:-1}));
  }
  return {title:'Gimnasio de '+gym.city,lines,seasons:1,band,rollInfo:{odds:[pv.win,0,100-pv.win],roll:lastRoll,labels:['Victoria','','Derrota']}};
}
function giovanniRun(s){
  const pv=gymPreview(s,GIOVANNI_RK);const lines=[];
  const gr=R()*100;
  if(gr<pv.win){
    s.rocketBoss=true;

  }
  return {title:'Desafío a Giovanni',lines,seasons:1,rollInfo:{odds:[pv.win,0,100-pv.win],roll:gr,labels:['Victoria','','Derrota']}};

function leagueRun(s){
  const lines=[];let all=true;
  for(const st of LEAGUE){
    const pv=gymPreview(s,st);
    if(R()*100<pv.win){lines.push(`✅ Derrotaste a ${st.leader} (${st.type}) — chance era ${pv.win}%`);}
    else{lines.push(`❌ Caíste ante ${st.leader} (${st.type}) — chance era ${pv.win}%`);all=false;break;}
  }
  if(all){s.leagueWon=true;lines.push('🏆 ¡Sos el nuevo Campeón de la Liga Pokémon!');}
  else{s.leagueFails++;lines.push('Caíste en la Liga. No hay bonus por intentos anteriores: para volver a intentarlo necesitás un equipo mejor. Cada intento te cuesta una estación.');}
  return {title:'Liga Pokémon',lines,seasons:1};
}

const rkKind=id=>RK_KINDS.find(k=>k.id===id)||RK_KINDS[0];
const pracNeed=v=>3+Math.floor(v/2);
function practice(s,stat){
  s.prac=s.prac||{};
  if(s.st[stat]>=STAT_CAP)return null;
  s.prac[stat]=(s.prac[stat]||0)+1;
  const n=pracNeed(s.st[stat]);
  if(s.prac[stat]>=n){s.prac[stat]=0;s.st[stat]++;return '⬆️ ¡'+SL[stat]+' sube a '+s.st[stat]+'! (por la práctica constante)';}
  return '📈 Práctica de '+SL[stat]+': '+s.prac[stat]+'/'+n;
}

  A.forEach(a=>{if(PRAC[a.id])a.prac=PRAC[a.id];if(a.id==='market'){a.prac='carisma';a.pracNote='por cada cambio que cierres';}});

function runAction(s,id,arg){
  const r=runActionCore(s,id,arg);
  if(PRAC[id]){const l=practice(s,PRAC[id]);if(l)r.lines.push(l);}
  if(id==='rkmission'){const l=practice(s,rkKind(arg).prac);if(l)r.lines.push(l);}
  if(id==='market'){ // cada cambio cerrado (Pokémon, piedra o evolución) suma una práctica de Carisma
    const n=s.counters.mkv||0;s.counters.mkv=0;
    if(n>0){let last=null;const ups=[];for(let i=0;i<n;i++){const l=practice(s,'carisma');if(l){if(l.startsWith('⬆️'))ups.push(l);last=l;}}
      r.lines.push(...ups);if(last&&!last.startsWith('⬆️'))r.lines.push(last);}
  }
  return r;
}
function runActionCore(s,id,arg){
  switch(id){
    case 'explore':return explore(s,arg);
    case 'train':return train(s,arg);
    case 'ship':return shipRun(s);
    case 'gym':return gymRun(s);
    case 'league':return leagueRun(s);
    case 'giovanni':return giovanniRun(s);
    case 'study':return studyRun(s,arg.years,arg.stat);
    case 'help':return {title:'Ayudar a la gente',lines:[],pool:'help',seasons:1};
    case 'shady':return {title:'Trabajos turbios',lines:[],pool:'shady',seasons:1};
    case 'field':return {title:'Trabajo de campo',lines:[],pool:'field',seasons:1};
    case 'rkmission':{const k=rkKind(arg);return {title:k.title,lines:[],pool:k.pool,seasons:1};}
    case 'rklay':s.heat=Math.max(0,s.heat-2);return {title:'Perfil bajo',lines:['Te escondés unos meses. Heat: '+s.heat+'/5.'],seasons:1};
    case 'gymwork':return {title:'Atender tu gimnasio',lines:[],pool:'gymown',seasons:1};
    case 'market':return {title:'Mercado de intercambio',lines:arg||[],seasons:1};
  }
  throw new Error('Acción desconocida '+id);
}
