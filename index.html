 opts:[O('Llevarlo a revivir',[45,30,25],[['s','ingenio',3]],['¡Funciona! Un Pokémon antiguo abre los ojos.',{gainPick:['Omanyte','Kabuto','Aerodactyl']}],['El proceso falla, pero aprendiste algo.',{st:{ingenio:1}}],['Se rompe en el viaje y el laboratorio te cobra el intento.',{loseItem:1}]),
  S('Dejarlo donde está','Un fósil es un fósil, y vos tenés cosas que hacer.',{rep:0})]},
{id:'dojo',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=3&&!(s.dex[106]&&s.dex[107]),title:'El dojo de lucha',
 text:()=>'Un dojo ofrece un desafío: quien supere sus pruebas se lleva a uno de sus Pokémon luchadores.',
 opts:[O('Hacer las pruebas',[30,35,35],[['s','valor',3],['t',['Fighting'],6]],['Superás todas las pruebas. El maestro te cede un Pokémon.',{gainPick:['Hitmonlee','Hitmonchan'],st:{valor:1}}],['Aguantás hasta la mitad y aprendés mucho.',{st:{valor:1}}],['Te echan del tatami con un golpe feo.',{rep:-1,time:1}]),
  S('Mirar desde afuera','Te quedás observando. Aprendés algo, pero nada más.',{st:{ingenio:1}})]},
{id:'eevee',pool:'random',kind:'Evento',w:2,req:s=>age(s)>=11&&s.box.filter(m=>m.sp>=133&&m.sp<=136).length<3,title:'Una oferta especial',
 text:()=>'Un coleccionista te ofrece un Eevee, pero quiere algo a cambio: que lo convenzas de que lo vas a cuidar.',
 opts:[O('Hablar con él',[45,30,25],[['s','carisma',3]],['Se emociona y te lo regala.',{gain:['Eevee']}],['Dice que lo va a pensar.',{}],['Piensa que sos demasiado joven y se ofende.',{st:{carisma:-1}}]),
  O('Ayudarlo con sus Pokémon unos días',[55,30,15],[['s','cuidado',3]],['Sos tan bueno con ellos que te regala el Eevee.',{gain:['Eevee'],st:{cuidado:1}}],['Aprendés algo, pero nada más.',{st:{cuidado:1}}],['Se te complica y perdés varios días.',{time:1}])]},
{id:'corner',pool:'random',kind:'Evento',w:2,req:s=>age(s)>=13,title:'El salón de juegos',
 text:()=>'Un salón de juegos exhibe premios llamativos: uno de ellos es un raro Pokémon, de verdad.',
 opts:[O('Jugar con cabeza',[20,40,40],[['s','ingenio',2]],['Ganás el premio mayor: un Porygon.',{gain:['Porygon'],moral:-1}],['Salís empatado.',{}],['Perdés una tarde entera y algo de tu mochila.',{time:1,loseItem:1}]),
  S('Pasar de largo','No es tu estilo.',{moral:1})]},
{id:'tormenta',pool:'random',kind:'Evento',w:3,req:s=>true,title:'Tormenta eléctrica',
 text:()=>'Una tormenta te sorprende en pleno camino. Los truenos suenan cada vez más cerca.',
 opts:[O('Refugiarte en una cueva',[35,50,15],[['t',['Rock','Ground'],6],['s','ingenio',1]],['Encontrás un refugio perfecto y hasta aprendés algo.',{st:{ingenio:1}}],['Pasás la noche incómodo, pero a salvo.',{}],['Se te mojan las cosas y se arruina una.',{loseItem:1}]),
  O('Seguir caminando',[25,35,40],[['s','valor',2],['t',['Electric'],6]],['Los truenos te inspiran. Entrenás bajo la lluvia.',{st:{valor:1}}],['Llegás empapado pero entero.',{}],['Un rayo cae cerca y te asusta mucho.',{time:1}])]},
{id:'torneo',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length<8,title:'Concurso de captura',
 text:()=>'El pueblo organiza un concurso: gana quien capture el Pokémon más bonito en un tiempo límite.',
 opts:[O('Participar',[35,40,25],[['s','cuidado',2],['t',['Bug','Flying'],5]],['¡Ganás! Premio y aplausos.',{gainZone:'bosque',rep:1}],['Quedás a mitad de tabla.',{}],['Te distraés y hacés el ridículo.',{rep:-1}]),
  S('Mirar desde la tribuna','Disfrutás el espectáculo.',{moral:1})]},
{id:'investigador',pool:'random',kind:'Evento',w:2,req:s=>!s.items.lupa,title:'Un investigador necesita ayuda',
 text:()=>'Un investigador anda muy ocupado catalogando Pokémon y te pide una mano.',
 opts:[O('Ayudarlo',[45,35,20],[['s','ingenio',3]],['Le caés tan bien que te regala su lupa de campo.',{item:'lupa',st:{ingenio:1}}],['Le servís, pero se queda con la lupa.',{st:{ingenio:1}}],['Cometés un error con sus notas.',{rep:-1}]),
  S('Decir que no tenés tiempo','Seguís tu camino.',{moral:-1})]},
{id:'festival',pool:'random',kind:'Evento',w:2,req:s=>!s.items.incienso,title:'Festival del pueblo',
 text:()=>'Hay un festival con comida, juegos y gente alegre. Un puesto reparte inciensos a quienes ayudan con los preparativos.',
 opts:[O('Ofrecerte a ayudar',[45,35,20],[['s','carisma',3]],['La gente te adora. Te dan un incienso especial.',{item:'incienso',rep:1}],['Ayudás un rato y volvés a casa contento.',{rep:1}],['Te pasás la tarde entre cajas.',{time:1}]),
  S('Disfrutar el festival','Comés de todo y volvés feliz.',{moral:1})]},
{id:'robo',pool:'random',kind:'Evento',w:2,req:s=>s.box.length>=3&&!s.rocket,title:'¡Ladrón!',
 text:()=>'Un hombre vestido de negro intenta llevarse a uno de tus Pokémon mientras dormís.',
 opts:[O('Perseguirlo',[35,25,40],[['s','valor',2],['s','sigilo',1]],['Lo alcanzás y recuperás todo. Antes de huir, deja caer una «R» roja.',{rep:1,flag:{rocketSeen:true}}],['Se escapa, pero tu Pokémon vuelve solo.',{flag:{rocketSeen:true}}],['Se lleva a uno de tus Pokémon.',{loseMon:1,flag:{rocketSeen:true}}]),
  O('Pedir ayuda a gritos',[30,40,30],[['s','carisma',2]],['Los vecinos acuden y el ladrón huye.',{rep:1}],['Nadie escucha, pero el ladrón se asusta y se va.',{}],['Nadie aparece a tiempo.',{loseMon:1}])]},
{id:'derrumbe',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=1,title:'Cueva derrumbada',
 text:()=>'Un derrumbe tapó la salida de una cueva y hay Pokémon atrapados del otro lado.',
 opts:[O('Despejar las rocas',[35,35,30],[['s','valor',2],['t',['Rock','Ground','Fighting'],5]],['Despejás el paso. Un Pokémon agradecido te acompaña.',{gainZone:'moon',moral:1}],['Abrís un hueco pequeño y salen todos.',{moral:1}],['Las rocas ceden y salís lastimado.',{time:1}]),
  O('Buscar otra salida con ingenio',[40,40,20],[['s','ingenio',3]],['Encontrás un atajo y rescatás a todos.',{moral:1,st:{ingenio:1}}],['Perdés tiempo, pero lo lográs.',{moral:1}],['Te perdés en la oscuridad y perdés algo de tu mochila.',{loseItem:1}])]},
{id:'lesion',pool:'random',kind:'Evento',w:2,req:s=>s.team.length>=1&&age(s)>=11,title:'Tu Pokémon se lastima',
 text:()=>'Después de un día largo, uno de tus Pokémon se lastima una pata.',
 opts:[S('Descansar una estación','Lo cuidás hasta que se recupera. Se acerca más a vos.',{time:1,st:{cuidado:1},moral:1}),
  O('Seguir de todos modos',[25,35,40],[['s','cuidado',3]],['Se recupera solo y sigue fuerte.',{},],['Cojea pero avanza.',{}],['La herida empeora y debés parar mucho tiempo.',{time:2}],{esc:true})]},
{id:'trade_mon',pool:'random',kind:'Intercambio',w:3,trade:'mon',pre:'Una entrenadora viajera necesita justo un Pokémon como el que te sobra.',req:s=>age(s)>=11&&dupes(s).length>0,title:'Una oferta de intercambio',
 text:()=>'',opts:[S('Aceptar el cambio','',{}),S('Rechazar','',{})]},
{id:'trade_stone',pool:'random',kind:'Intercambio',w:3,trade:'stone',pre:'Un comerciante ambulante muestra piedras de colores que hacen evolucionar a los Pokémon.',req:s=>dupes(s).length>0,title:'Un comerciante de piedras',
 text:()=>'',opts:[S('Aceptar el cambio','',{}),S('Rechazar','',{})]},
{id:'brillo',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=1,title:'Un brillo en la roca',
 text:()=>'Algo brilla dentro de una pared de roca. Podría ser una piedra evolutiva.',
 opts:[O('Extraerla con cuidado',[40,35,25],[['s','ingenio',2],['t',['Rock','Ground'],5]],['La sacás entera. ¡Es una piedra!',{stone:1}],['Solo era mica brillante.',{st:{ingenio:1}}],['La pared cede y perdés herramientas.',{loseItem:1}]),
  S('Dejarla','No vale el riesgo.',{rep:0})]},
// ===== Ayudar =====
{id:'hp_huerto',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'El huerto del vecino',
 text:()=>'Un vecino tiene el huerto lleno de malezas y no da abasto.',
 opts:[O('Ayudar con tus Pokémon',[55,35,10],[['t',['Grass','Ground','Bug'],5],['s','cuidado',2]],['El huerto queda precioso y te regala frutos.',{rep:1,moral:1,st:{cuidado:1}}],['Hacés lo que podés.',{rep:1}],['Tus Pokémon arruinan la mitad del huerto.',{rep:-1}]),
  O('Ayudar con las manos',[45,45,10],[['s','valor',1]],['Terminás exhausto, pero orgulloso.',{rep:1,moral:1,st:{valor:1}}],['Algo es algo.',{rep:1}],['Te lastimás la espalda y perdés varios días.',{time:1}])]},
{id:'hp_centro',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'El Centro Pokémon desbordado',
 text:()=>'El Centro Pokémon está lleno por una temporada de tormentas y piden voluntarios.',
 opts:[O('Cuidar a los Pokémon',[55,35,10],[['s','cuidado',3]],['Aprendés mucho y una enfermera te agradece.',{rep:1,moral:1,st:{cuidado:1}}],['Servís de ayuda.',{rep:1}],['Es más difícil de lo que parecía y cometés un error.',{rep:-1}]),
  O('Organizar a la gente',[50,40,10],[['s','carisma',3]],['Todos te siguen. Todo fluye.',{rep:1,st:{carisma:1}}],['Ordenás lo que podés.',{rep:1}],['Nadie te escucha y se arma un lío.',{rep:-1}])]},
{id:'hp_turistas',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'Turistas perdidos',
 text:()=>'Un grupo de turistas no encuentra el camino y tiene miedo de los Pokémon salvajes.',
 opts:[O('Guiarlos con tu mapa',[55,35,10],[['s','ingenio',2]],['Los llevás sanos y salvos. Uno te regala un Pokémon.',{rep:1,gainWild:1}],['Los llevás y se despiden con gratitud.',{rep:1}],['Se pierden los tres y perdés tu mapa.',{loseItem:1}]),
  S('Indicarles el camino y seguir','No ayudás mucho, pero tampoco molestás.',{moral:1})]},
// ===== Turbios =====
{id:'sh_cartera',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Una billetera descuidada',
 text:()=>'En la feria, un turista guarda su billetera con total descuido.',
 opts:[O('Sacársela sin que note',[40,30,30],[['s','sigilo',3]],['Salió limpio. Nadie vio nada.',{st:{sigilo:1},moral:-1,flag:{rocketSeen:true}}],['Cambiás de idea a último momento.',{moral:1}],['Te agarran la mano.',{heat:1,rep:-1}]),
  S('Dejarla pasar','No vale la pena.',{moral:1})]},
{id:'sh_apuestas',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Apuestas clandestinas',
 text:()=>'En un sótano se hacen peleas Pokémon con dinero de por medio. Buscan un desafiante.',
 opts:[O('Apostar con tu equipo',[35,25,40],[['p',1],['s','valor',2]],['Ganás. Te llevan un Pokémon de premio.',{gainWild:1,moral:-1,st:{sigilo:1}}],['Perdés poco y salís rápido.',{moral:-1}],['Perdés y la policía irrumpe.',{heat:1,loseMon:1}]),
  S('Mirar desde la penumbra','Aprendés algo sobre el lugar.',{st:{sigilo:1}})]},
{id:'sh_contrabando',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Un contrabandista',
 text:()=>'Un contrabandista necesita que alguien cruce un cargamento de huevos Pokémon sin llamar la atención.',
 opts:[O('Cruzar el cargamento',[40,35,25],[['s','sigilo',2],['s','ingenio',1]],['Salió perfecto. Te dejan quedarte con un huevo.',{gainWild:1,moral:-1,st:{sigilo:1}}],['Cruzás sin problemas, pero te pagan poco.',{moral:-1}],['Un oficial sospecha de tu mochila.',{heat:1,loseItem:1}]),
  S('Rechazar','Mejor no meterte.',{moral:1})]},
// ===== Misiones Rocket =====
{id:'rk_cobro',pool:'rocket',kind:'Misión',w:3,req:s=>true,title:'Cobro de «protección»',
 text:()=>'Un comerciante no paga su cuota a la organización.',
 opts:[O('Intimidarlo',[45,30,25],[['s','valor',2],['s','carisma',1]],['Paga todo. Los jefes toman nota.',{rocketPts:1,moral:-1}],['Paga la mitad.',{moral:-1}],['Llama a la policía.',{heat:1}]),
  O('Convencerlo con labia',[40,35,25],[['s','carisma',3]],['Lo convencés de que le conviene pagar.',{rocketPts:2}],['Promete pagar la semana que viene.',{}],['Se ríe de vos.',{rocketPts:-1}])]},
{id:'rk_contrabando',pool:'rocket',kind:'Misión',w:3,req:s=>true,title:'Cargamento clandestino',
 text:()=>'Hay que mover un cargamento de Pokémon capturados hasta un puerto sin que la policía lo note.',
 opts:[O('Planificar la ruta',[40,35,25],[['s','ingenio',3]],['Llegan todos. Te ascienden.',{rocketPts:2,moral:-1}],['Llegan algunos.',{rocketPts:1}],['Un control los detiene.',{heat:2}]),
  O('Mover el cargamento rápido',[35,25,40],[['s','sigilo',2],['s','valor',1]],['Llegás antes de que se den cuenta.',{rocketPts:2,moral:-1}],['Perdés algo en el camino.',{moral:-1}],['Un oficial te sigue.',{heat:2}])]},
{id:'rk_silph',pool:'rocket',kind:'Misión',w:2,req:s=>s.rocketPts>=16,title:'Infiltrar un edificio corporativo',
 text:()=>'Una gran empresa guarda tecnología que los jefes quieren. Hay que entrar disfrazado.',
 opts:[O('Entrar como empleado',[35,30,35],[['s','sigilo',2],['s','ingenio',2]],['Cruzás los pasillos sin mirar atrás. Tu nombre llega a los jefes.',{rocketPts:3,gainWild:1,moral:-1}],['Conseguís poco, pero salís entero.',{rocketPts:1}],['Te detectan y debés huir.',{heat:2,rocketPts:-1}]),
  O('Distraer a los guardias',[30,35,35],[['s','carisma',2],['s','valor',1]],['Todos miran hacia otro lado. Todo sale perfecto.',{rocketPts:3,moral:-1}],['Hacés el ruido justo.',{rocketPts:1}],['Se dan cuenta del truco.',{heat:2}])]},
{id:'rk_redada',pool:'rocket',kind:'Redada',w:4,req:s=>s.rocket&&s.heat>=2,title:'Redada en el escondite',
 text:()=>'Suenan sirenas cerca del escondite. La policía está haciendo una redada y tenés pocos segundos.',
 opts:[O('Escabullirte por los techos',[40,30,30],[['s','sigilo',3]],['Escapás sin que nadie te vea. Los jefes lo notan.',{heat:-1,rocketPts:1}],['Salís, pero dejás cosas atrás.',{loseItem:1}],['Te ven correr y empieza una persecución.',{heat:3}]),
  O('Negociar con el oficial',[30,30,40],[['s','carisma',3]],['Lo convencés de que es un malentendido.',{heat:-1},],['Te deja ir con una advertencia.',{rocketPts:-1}],['Te lleva un rato a la comisaría.',{heat:3}],{esc:true})]},
// ===== Gimnasio propio =====
{id:'go_retador',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'Llega un retador',
 text:()=>'Un entrenador entra con la barbilla alta: «Vengo a ganarte la medalla.»',
 opts:[O('Aceptar el reto',[40,30,30],[['p',1],['s','valor',2]],['Ganás con elegancia. Se corre la voz.',{fame:1,rep:1}],['Un duelo muy parejo. Ambos aprenden.',{rep:1}],['Perdés y el cartel queda raspado.',{fame:-1}]),
  S('Enseñarle en lugar de pelear','Le das consejos. Se va agradecido.',{fame:1,moral:1})]},
{id:'go_inspeccion',pool:'gymown',kind:'Gimnasio',w:2,req:s=>true,title:'Inspección de la Liga',
 text:()=>'Un inspector de la Liga visita tu gimnasio para evaluar si cumple con las reglas.',
 opts:[O('Mostrarle todo en orden',[45,35,20],[['s','ingenio',3]],['Queda impresionado. Tu gimnasio sube de categoría.',{fame:2}],['Aprueba sin comentarios.',{fame:1}],['Encuentra irregularidades y te multa.',{fame:-1,rep:-1}]),
  O('Hacerlo sentir en casa',[40,40,20],[['s','carisma',3]],['Se va encantado.',{fame:2}],['Se va conforme.',{rep:1}],['Se va con cara de pocos amigos y habla mal de vos.',{fame:-1}])]},
{id:'go_publico',pool:'gymown',kind:'Gimnasio',w:2,req:s=>true,title:'Duelo público con un líder rival',
 text:()=>'El líder de otra ciudad te desafía en la plaza frente a todos.',
 opts:[O('Aceptar',[35,25,40],[['p',1],['s','carisma',2],['s','valor',1]],['Todos aplauden tu victoria.',{fame:2}],['Empatan, y la gente te respeta.',{fame:1}],['Perdés frente a todos.',{fame:-2}]),
  S('Declinar con elegancia','Proponés un duelo amistoso para otro día.',{rep:1})]},
{id:'go_alumnos',pool:'gymown',kind:'Gimnasio',w:2,req:s=>true,title:'Entrenar a los alumnos',
 text:()=>'Un grupo de chicos quiere aprender a entrenar Pokémon. Te piden clases.',
 opts:[O('Dar la clase',[50,35,15],[['s','cuidado',2],['s','carisma',2]],['Se enamoran de tu estilo. Tu gimnasio gana fama.',{fame:1,st:{carisma:1}}],['Aprenden un poco.',{rep:1}],['Se distraen y rompen cosas del gimnasio.',{loseItem:1}]),
  S('Delegar en un asistente','Los chicos están contentos y vos descansás.',{rep:1})]},
// ===== Trabajo de campo (Profesor) =====
{id:'fd_censo',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Censo de campo',
 text:()=>'El laboratorio te pide un censo de los Pokémon de una zona. Tus resultados valdrán para tu próxima publicación.',
 opts:[O('Observar con paciencia',[45,35,20],[['s','ingenio',3],['dex',1]],['Tus notas son impecables.',{rp:3,st:{ingenio:1}}],['Reunís datos útiles, pero pocos.',{rp:1}],['Se te mojan los cuadernos y perdés el trabajo de la semana.',{time:1}]),
  O('Tomar muestras de varios Pokémon',[40,30,30],[['s','cuidado',2],['dup',1]],['Las muestras son valiosas. Una trae una piedra incrustada.',{rp:3,stone:1}],['Alcanza para un informe corto.',{rp:1}],['Un Pokémon se asusta y rompe tu equipo.',{loseItem:1}])]},
{id:'fd_colega',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Un colega rival',
 text:()=>'Otro investigador trabaja sobre el mismo tema que vos. Hay que decidir cómo encararlo.',
 opts:[O('Competir con un mejor estudio',[35,30,35],[['s','ingenio',3],['dex',1]],['Tu estudio supera al suyo.',{rp:4,rep:1}],['Empatan.',{rp:1}],['Él se queda con el crédito.',{rp:-2,rep:-1}]),
  O('Colaborar',[50,35,15],[['s','carisma',2]],['El estudio conjunto sale muy bien.',{rp:3,rep:1}],['Dividen el mérito.',{rp:1}],['Te deja con la mayor parte del trabajo.',{time:1}])]},
{id:'fd_hipotesis',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Una hipótesis arriesgada',
 text:()=>'Se te ocurre una explicación nueva para el comportamiento de un grupo de Pokémon. Es audaz.',
 opts:[O('Ponerla a prueba',[35,25,40],[['s','ingenio',3],['dex',1]],['Se confirma. Te citan en un congreso.',{rp:4,st:{carisma:1}}],['Los resultados son mixtos.',{rp:1}],['La refutan y te critican en público.',{rp:-1,rep:-1}]),
  S('Dejarla de lado y seguir con lo seguro','Sumás un poco de trabajo sólido.',{rp:1})]},
// ===== Eventos nuevos con chequeos de stats (C = exige un mínimo; por debajo castiga fuerte) =====
{id:'puente',pool:'random',kind:'Evento',w:2,req:s=>true,title:'El puente colgante',
 text:()=>'El camino más corto cruza un puente de sogas que se balancea con el viento. Del otro lado se ve una arboleda llena de Pokémon.',
 opts:[O('Cruzarlo corriendo',[30,30,40],[C('valor',7,4)],['Llegás de un salto y un Pokémon curioso te sigue.',{gainWild:1,st:{valor:1}}],['Cruzás temblando, pero cruzás.',{}],['Una soga cede y perdés algo de tu mochila.',{loseItem:1}]),
  O('Buscar otro camino con tu mapa',[40,40,20],[C('ingenio',6,3)],['Encontrás un atajo seguro y hasta una piedra tirada.',{stone:1}],['Rodeás un buen rato, pero llegás.',{}],['Te perdés y perdés tiempo.',{time:1}])]},
{id:'acertijo',pool:'random',kind:'Evento',w:2,req:s=>age(s)>=11,title:'Un acertijo en el camino',
 text:()=>'Un anciano bloquea el sendero: «Solo pasa quien resuelve mi acertijo.» Tiene un cesto de piedras de colores a sus pies.',
 opts:[O('Resolverlo vos mismo',[30,25,45],[C('ingenio',8,4)],['Lo resolvés al instante. El anciano te regala una piedra y te felicita.',{stone:1,st:{ingenio:1}}],['Te trabás, pero el anciano te deja pasar.',{}],['Fallás tres veces y te vas humillado.',{rep:-1,time:1}]),
  O('Pedirle una pista con simpatía',[35,40,25],[C('carisma',6,3)],['Se divierte con vos y te deja una piedra de regalo.',{stone:1}],['Te da una pista vaga.',{}],['Se ofende y te echa.',{rep:-1}])]},
{id:'campamento',pool:'random',kind:'Evento',w:2,req:s=>true,title:'Un campamento de viajeros',
 text:()=>'Al caer la noche encontrás un campamento con una fogata y varios entrenadores contando historias.',
 opts:[O('Sumarte a la ronda',[40,35,25],[C('carisma',6,3)],['Hacés buenas migas y uno te regala un Pokémon que le sobraba.',{gainWild:1,rep:1}],['Pasás una noche agradable.',{}],['Tu comentario cae mal y se arma un clima feo.',{rep:-1}]),
  O('Observar de lejos y aprender',[40,40,20],[C('sigilo',6,3)],['Escuchás un dato valioso sobre una zona escondida.',{st:{ingenio:1}}],['No sacás nada en limpio.',{}],['Te descubren espiando y te corren.',{rep:-1}])]},
{id:'herido',pool:'random',kind:'Evento',w:3,req:s=>true,title:'Un Pokémon herido',
 text:()=>'Entre los arbustos hay un Pokémon salvaje con una pata lastimada. Tiembla pero no se deja tocar.',
 opts:[O('Curarlo con paciencia',[30,30,40],[C('cuidado',7,4)],['Se deja curar y te acompaña desde entonces.',{gainWild:1,moral:1,st:{cuidado:1}}],['Lo curás y se va corriendo.',{moral:1}],['Se asusta y te muerde.',{st:{cuidado:-1},time:1}]),
  O('Improvisar un botiquín con lo que sabés',[35,35,30],[C('ingenio',6,3)],['El vendaje es perfecto. Se queda con vos.',{gainWild:1}],['Lo ayudás a medias.',{}],['Lo empeorás y perdés material.',{loseItem:1}])]},
{id:'novato',pool:'random',kind:'Evento',w:2,req:s=>age(s)>=12,title:'Un novato pide consejo',
 text:()=>'Un chico de unos diez años te frena: acaba de recibir su primer Pokémon y no sabe qué hacer con él.',
 opts:[O('Explicarle cómo funciona todo',[40,35,25],[C('ingenio',6,3),C('carisma',5,2)],['Entiende todo y su familia te lo agradece con una piedra.',{stone:1,rep:1}],['Entiende más o menos.',{rep:1}],['Le explicás mal y se confunde.',{rep:-1}]),
  O('Proponerle un duelo amistoso',[45,30,25],[C('valor',5,3)],['Aprende un montón y te ve como un ejemplo.',{rep:1,st:{valor:1}}],['Un duelo parejo.',{}],['Se pone a llorar y la gente te mira mal.',{rep:-1}])]},
{id:'cazador',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=1,title:'Un cazador furtivo',
 text:()=>'Escuchás sonidos de trampas. Un cazador furtivo está capturando Pokémon salvajes sin permiso.',
 opts:[O('Seguirlo en silencio',[30,30,40],[C('sigilo',7,4)],['Lo seguís hasta su guarida y liberás a todos.',{rep:2,gainWild:1,moral:1}],['Lo perdés de vista.',{}],['Te descubre y te espanta de un golpe.',{time:1,rep:-1}]),
  O('Enfrentarlo cara a cara',[25,30,45],[C('valor',8,4),['p',1]],['Lo hacés huir y rescatás a los Pokémon.',{rep:2,moral:1}],['Huye antes de que lo alcances.',{}],['Te supera y te deja lastimado.',{time:2,loseItem:1}])]},
{id:'pesca',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=2,title:'Torneo de pesca',
 text:()=>'En el muelle hay un torneo: gana quien saque el Pokémon más raro del agua.',
 opts:[O('Esperar con paciencia',[30,40,30],[C('cuidado',6,3)],['Sacás un ejemplar espectacular.',{gainZone:'costa',rep:1}],['Pescás lo de siempre.',{}],['Se te enreda el hilo y perdés tu equipo.',{loseItem:1}]),
  O('Usar técnica y cálculo',[30,35,35],[C('ingenio',7,3)],['Calculás la corriente y sacás un premio mayor.',{gainZone:'costa',st:{ingenio:1}}],['Lográs algo modesto.',{}],['Te equivocás de cebo y quedás último.',{rep:-1}])]},
{id:'cumbre',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=3,title:'Una cumbre sin escalar',
 text:()=>'Un guía local te cuenta que desde la cima de una montaña cercana se ven rarezas que no bajan nunca al valle.',
 opts:[O('Escalar por la cara difícil',[30,25,45],[C('valor',8,4),['t',['Rock','Fighting','Flying'],5]],['Llegás a la cima. Hay una piedra tirada y una vista inolvidable.',{stone:1,st:{valor:1}}],['Llegás agotado, sin nada que mostrar.',{}],['Resbalás y perdés tiempo y equipo.',{time:2,loseItem:1}]),
  O('Convencer al guía de que te lleve',[35,40,25],[C('carisma',6,3)],['Te lleva por el camino seguro y te muestra un nido.',{gainWild:1}],['Te lleva hasta la mitad.',{}],['Te cobra de más y se queda con tus cosas.',{loseItem:1}])]},
{id:'incendio',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=1,title:'Incendio en el bosque',
 text:()=>'Humo en el horizonte: un pequeño incendio está avanzando hacia un grupo de Pokémon.',
 opts:[O('Combatir el fuego',[30,30,40],[C('valor',6,3),['t',['Water'],6]],['Lo apagás y los Pokémon te lo agradecen. Uno se queda.',{gainZone:'bosque',rep:2}],['Contenés lo peor.',{rep:1}],['El fuego te sorprende y perdés tus cosas.',{loseItem:1,time:1}]),
  O('Guiar a los Pokémon a salvo',[40,35,25],[C('cuidado',6,3)],['Los llevás a un valle seguro.',{rep:2,moral:1}],['Salvás a unos pocos.',{moral:1}],['Se dispersan y perdés a uno de los tuyos.',{loseMon:1}])]},
{id:'maestro',pool:'random',kind:'Evento',w:2,req:s=>age(s)>=13,title:'Un maestro retirado',
 text:()=>'Un viejo entrenador retirado vive solo en una cabaña. Dicen que fue muy bueno, pero ya no acepta alumnos.',
 opts:[O('Convencerlo de que te entrene',[30,30,40],[C('carisma',7,4)],['Algo en vos le recuerda a su juventud. Te entrena una temporada.',{st:{valor:2},time:1}],['Te da una lección y te despide.',{st:{valor:1}}],['Se enoja y te echa a gritos.',{rep:-1}]),
  O('Ayudarlo con la cabaña sin decir nada',[40,40,20],[C('cuidado',5,3),C('valor',5,2)],['Después de una semana te invita a pasar.',{st:{ingenio:1,cuidado:1}}],['Ni se da cuenta.',{}],['Rompés algo valioso sin querer.',{rep:-1,loseItem:1}])]},
{id:'biblioteca',pool:'random',kind:'Evento',w:2,req:s=>true,title:'La biblioteca vieja',
 text:()=>'En un pueblo hay una biblioteca antigua con libros que nadie leyó en años: mapas, notas de naturalistas y uno que parece escondido.',
 opts:[O('Revisar los libros uno por uno',[35,30,35],[C('ingenio',9,4)],['Encontrás un mapa con una zona marcada y una piedra pegada en la tapa.',{stone:1,st:{ingenio:1}}],['Aprendés cosas útiles.',{st:{ingenio:1}}],['Te pasás los días sin encontrar nada.',{time:1}]),
  O('Preguntarle a la bibliotecaria',[45,40,15],[C('carisma',5,3)],['Le caés tan bien que te presta un libro raro.',{st:{ingenio:1}}],['Te recomienda lecturas.',{}],['Te manda a callar y te pide que te vayas.',{rep:-1}])]},
{id:'huevo',pool:'random',kind:'Evento',w:2,req:s=>s.badges.length>=1,title:'Un huevo abandonado',
 text:()=>'En un nido vacío encontrás un huevo tibio. Parece que nadie volvió por él en mucho tiempo.',
 opts:[O('Incubarlo vos',[30,30,40],[C('cuidado',8,4)],['Después de unas semanas, nace un Pokémon que se encariña con vos.',{gainWild:1,moral:1,st:{cuidado:1}}],['Se enfría y no pasa nada.',{}],['Se rompe en tu mochila y manchás tus cosas.',{loseItem:1}]),
  S('Llevarlo a un refugio','Lo dejás en buenas manos.',{moral:1,rep:1})]},
{id:'carrera',pool:'random',kind:'Evento',w:2,req:s=>age(s)>=12,title:'La carrera de bicicletas',
 text:()=>'Hay una carrera de bicicletas por el sendero costero. El premio es una piedra evolutiva.',
 opts:[O('Ir a todo ritmo',[30,30,40],[C('valor',6,3)],['Cruzás primero y te llevás el premio.',{stone:1,rep:1}],['Terminás en la mitad de tabla.',{}],['Te caés en una curva.',{time:1,loseItem:1}]),
  O('Tomar el atajo por el bosque',[30,30,40],[C('sigilo',7,3),C('ingenio',5,2)],['Te adelantás sin que nadie se dé cuenta y ganás.',{stone:1,st:{sigilo:1}}],['Te perdés pero llegás.',{}],['Te descalifican por trampa.',{rep:-2}])]},
{id:'tienda',pool:'random',kind:'Evento',w:2,req:s=>true,title:'Liquidación en la tienda',
 text:()=>'Una tienda cierra y vende todo a mitad de precio. Hay objetos útiles, pero la dueña es dura de pelar.',
 opts:[O('Regatear',[35,35,30],[C('carisma',7,4)],['Conseguís una piedra evolutiva por casi nada.',{stone:1}],['Te hace un precio justo.',{}],['Te cobra de más y salís con menos.',{loseItem:1}]),
  O('Comparar productos y detectar la mejor oferta',[40,35,25],[C('ingenio',6,3)],['Encontrás la ganga del día.',{stone:1,st:{ingenio:1}}],['Comprás algo razonable.',{}],['Te dejás engañar y perdés plata.',{loseItem:1}])]},
// ===== Ayudar =====
{id:'hp_inundacion',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'El río se desborda',
 text:()=>'Las lluvias hicieron desbordar un arroyo y varias familias necesitan ayuda para mover sus cosas.',
 opts:[O('Cargar bolsas de arena',[40,35,25],[C('valor',6,3),['t',['Water','Ground'],5]],['Contenés el agua y te lo agradecen con una piedra.',{stone:1,rep:2}],['Ayudás todo lo que podés.',{rep:1}],['Te lastimás la espalda y perdés tiempo.',{time:1}]),
  O('Coordinar la evacuación',[40,40,20],[C('carisma',6,3)],['Todos te siguen y no hay heridos.',{rep:2,moral:1}],['Sale más o menos.',{rep:1}],['Hay confusión y se pierden cosas.',{rep:-1}])]},
{id:'hp_perdido',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'Un chico perdido',
 text:()=>'Un chico llora a un costado del camino: se alejó de sus padres y no sabe dónde está.',
 opts:[O('Calmarlo y preguntarle detalles',[45,35,20],[C('carisma',5,3)],['Lo tranquilizás y la familia te regala un Pokémon.',{gainWild:1,rep:1,moral:1}],['Lo llevás hasta su casa sin drama.',{rep:1,moral:1}],['Se asusta de vos y sale corriendo.',{rep:-1}]),
  O('Buscar rastros y seguirlos',[40,35,25],[C('ingenio',6,3),C('sigilo',5,2)],['Seguís las huellas y encontrás a sus padres enseguida.',{rep:2,moral:1}],['Les das vueltas, pero los encontrás.',{rep:1}],['Te perdés vos también.',{time:1}])]},
{id:'hp_vacunas',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'Jornada de vacunación',
 text:()=>'El centro Pokémon organiza una jornada de vacunación y necesitan gente que mantenga calmos a los pacientes.',
 opts:[O('Calmar a los Pokémon asustados',[40,35,25],[C('cuidado',7,4)],['Todos se dejan vacunar. La doctora te agradece con una piedra.',{stone:1,st:{cuidado:1}}],['Ayudás con lo que podés.',{rep:1}],['Uno te muerde y se arma un revuelo.',{rep:-1,st:{cuidado:-1}}]),
  O('Organizar la fila y las fichas',[45,40,15],[C('ingenio',5,3)],['Todo marcha sin demoras.',{rep:2}],['Un poco desordenado.',{rep:1}],['Mezclás las fichas y hay que repetir turnos.',{rep:-1}])]},
{id:'hp_maquina',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'La máquina descompuesta',
 text:()=>'La máquina que riega los cultivos del pueblo dejó de funcionar. Nadie sabe arreglarla.',
 opts:[O('Desarmarla y repararla',[35,30,35],[C('ingenio',7,4)],['La dejás andando mejor que nueva.',{rep:2,st:{ingenio:1}}],['La arreglás a medias.',{rep:1}],['La terminás de romper.',{rep:-1,loseItem:1}]),
  O('Usar a tus Pokémon para mover los engranajes',[40,35,25],[C('valor',5,3),['t',['Electric','Steel'],6]],['Funciona de maravilla y te regalan frutos.',{rep:1,gainWild:1}],['Funciona un rato.',{}],['Tus Pokémon se agotan sin lograrlo.',{time:1}])]},
{id:'hp_mudanza',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'Una mudanza imposible',
 text:()=>'Una señora mayor se muda y no puede cargar sus muebles. Te mira esperanzada.',
 opts:[O('Cargar los muebles pesados',[45,35,20],[C('valor',6,3)],['Terminás en un rato y te regala unos ahorros.',{rep:1,stone:1}],['Los mudás todos, agotado.',{rep:1}],['Se te cae un mueble y rompés uno.',{rep:-1,loseItem:1}]),
  O('Organizar una cuadrilla de vecinos',[45,40,15],[C('carisma',6,3)],['Todos ayudan y se arma una fiesta.',{rep:2,moral:1}],['Aparecen unos pocos.',{rep:1}],['Nadie quiere ayudarte.',{rep:-1}])]},
{id:'hp_posada',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'La posada sin cocinero',
 text:()=>'En una posada del camino se enfermó el cocinero justo cuando llega un grupo grande de viajeros. El dueño te mira con cara de súplica.',
 opts:[O('Cocinar para los viajeros',[45,35,20],[C('cuidado',5,3)],['Se corre la voz de tu cocina. El dueño te regala un Incienso.',{item:'incienso',rep:1}],['Salen platos comestibles y todos comen.',{rep:1}],['Se te quema todo y pagás los daños.',{loseItem:1}]),
  O('Atender las mesas',[50,35,15],[C('carisma',4,3)],['Las propinas son enormes y un viajero te regala un Pokémon que no podía cuidar.',{gainWild:1,rep:1}],['Pasás la noche sirviendo.',{rep:1}],['Le volcás una bandeja a un cliente.',{rep:-1}])]},
{id:'hp_biblioteca',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'La biblioteca del pueblo',
 text:()=>'La bibliotecaria está desbordada: llegó una donación de cajas con libros sobre Pokémon y nadie tiene tiempo de ordenarlos.',
 opts:[O('Catalogar los libros',[45,40,15],[C('ingenio',5,3)],['Encontrás un estudio olvidado y te deja usarlo para aprender.',{st:{ingenio:1},rep:1}],['Ordenás una estantería entera.',{rep:1}],['Mezclás las secciones y tenés que rehacerlo todo.',{time:1}]),
  O('Leerles cuentos a los chicos',[55,35,10],[C('carisma',4,3)],['Los chicos te adoran y sus padres te agradecen con una piedra.',{stone:1,rep:1}],['Pasan una tarde tranquila.',{rep:1,moral:1}],['Se aburren y se arma un griterío.',{rep:-1}])]},
{id:'hp_torneo',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'El torneo de la escuela',
 text:()=>'La escuela del pueblo organiza un torneo entre los chicos y falta alguien que lo coordine.',
 opts:[O('Arbitrar los combates',[45,35,20],[C('valor',4,3)],['Todos aceptan tus decisiones. La directora te regala una piedra.',{stone:1,rep:1}],['Arbitrás sin problemas.',{rep:1}],['Una decisión polémica y los padres reclaman.',{rep:-1}]),
  O('Organizar la merienda y los equipos',[50,35,15],[C('carisma',4,3)],['Todos terminan encantados y una familia te regala un Pokémon.',{gainWild:1,rep:1}],['Sale una linda tarde.',{rep:1}],['Se arma un lío con los equipos.',{rep:-1}])]},
{id:'hp_abuela',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'La abuela de la plaza',
 text:()=>'Una señora muy mayor te frena en la plaza: dice que fue entrenadora hace mucho y quiere que alguien la acompañe en su paseo.',
 opts:[O('Acompañarla y escucharla',[40,40,20],[C('carisma',3,3)],['Te cuenta secretos de su época y te regala una piedra.',{stone:1,rep:1}],['Pasás una tarde agradable.',{rep:1,moral:1}],['Se queda dormida y se ofende cuando te vas.',{rep:-1}]),
  O('Cargarle las compras',[50,40,10],[C('valor',3,3)],['Te invita a merendar y te regala un Pokémon que ya no puede cuidar.',{gainWild:1,moral:1}],['Es una caminata larga pero la dejás en su casa.',{rep:1}],['Se te cae una bolsa y rompés todo.',{rep:-1}])]},
{id:'hp_guarderia',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'La guardería desbordada',
 text:()=>'Una guardería de Pokémon se quedó sin cuidadores por un resfrío general y hay veinte huevos por atender.',
 opts:[O('Hacerte cargo del turno',[40,35,25],[C('cuidado',8,4)],['Cuidás cada huevo con dedicación. Uno nace de golpe y te adopta.',{gainWild:1,moral:1,st:{cuidado:1}}],['Pasás el turno sin sobresaltos.',{rep:1}],['Se rompen dos huevos y te sentís fatal.',{rep:-1,moral:-1}]),
  O('Repartir tareas entre los voluntarios',[45,40,15],[C('carisma',6,3)],['Todo se organiza solo.',{rep:2}],['Cada uno hace lo que puede.',{rep:1}],['Se pelean por las tareas.',{rep:-1}])]},
// ===== Turbios =====
{id:'sh_falsificar',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Documentos falsos',
 text:()=>'Un tipo ofrece pagar bien por entradas falsificadas a un evento exclusivo. Necesita manos hábiles.',
 opts:[O('Falsificar con precisión',[30,30,40],[C('ingenio',8,4)],['Salen perfectas. Te pagan en piedras y te dejás ver poco.',{stone:1,st:{ingenio:1},moral:-1}],['Salen aceptables.',{moral:-1}],['Un detalle te delata.',{heat:1,rep:-1}]),
  O('Colarte vos mismo al evento',[30,30,40],[C('sigilo',7,4)],['Entrás sin que nadie note nada y te llevás un premio.',{gainWild:1,st:{sigilo:1}}],['Te quedás afuera.',{}],['Los guardias te sacan a rastras.',{heat:1,time:1}])]},
{id:'sh_estafa',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'La gran estafa',
 text:()=>'Un viajero crédulo cree que tenés un Pokémon extremadamente raro para venderle. No tenés nada de eso.',
 opts:[O('Venderle humo con labia',[30,30,40],[C('carisma',8,4)],['Te lo compra y te paga en piedras.',{stone:1,moral:-1}],['Duda y se va.',{}],['Se da cuenta y arma un escándalo.',{heat:1,rep:-1}]),
  O('Inventar documentación técnica',[35,30,35],[C('ingenio',7,3),C('carisma',5,2)],['Le parece creíble y te paga bien.',{stone:1,st:{ingenio:1},moral:-1}],['Te pide pensarlo.',{}],['Te pide una prueba y no podés darla.',{rep:-2,heat:1}])]},
{id:'sh_allanamiento',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Una casa vacía',
 text:()=>'Una casa grande parece vacía por vacaciones. Dentro hay un cofre que le interesa a un comprador.',
 opts:[O('Entrar por la ventana',[30,25,45],[C('sigilo',8,4)],['Entrás y salís sin dejar rastro. El cofre trae una piedra.',{stone:1,st:{sigilo:1},moral:-1}],['Encontrás la casa casi vacía.',{}],['Salta la alarma.',{heat:2,rep:-1}]),
  O('Forzar la puerta',[25,25,50],[C('valor',7,3)],['Rompés la puerta y salís con el botín.',{gainWild:1,moral:-1}],['No lográs abrirla.',{}],['El ruido llama a los vecinos.',{heat:2}])]},
{id:'sh_pelea',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Pelea en el callejón',
 text:()=>'Unos tipos organizan combates sin reglas entre entrenadores. Pagan bien, pero hay que aguantar.',
 opts:[O('Entrar al ring',[30,25,45],[C('valor',8,4),['p',1]],['Ganás varias peleas seguidas. Te llevan a un Pokémon de premio.',{gainWild:1,st:{valor:1},moral:-1}],['Salís empatado.',{}],['Te dejan en el piso y perdés a un Pokémon.',{loseMon:1,heat:1}]),
  O('Apostar a favor de otro',[35,30,35],[C('ingenio',6,3)],['Acertás de lleno y cobrás en piedras.',{stone:1}],['Salís a mano.',{}],['Perdés y te quedás sin nada.',{loseItem:1}])]},
{id:'sh_cerradura',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Una caja fuerte vieja',
 text:()=>'Un coleccionista te muestra una caja fuerte antigua cuyo código perdió. Si la abrís, te promete compartir lo que haya.',
 opts:[O('Probar combinaciones con lógica',[30,35,35],[C('ingenio',7,4),C('sigilo',5,2)],['Con paciencia, la abrís. Adentro hay una piedra y unos ahorros.',{stone:1,st:{ingenio:1}}],['No lográs abrirla.',{}],['La trabás para siempre y se enoja.',{rep:-1,heat:1}]),
  O('Forzarla con herramientas',[30,25,45],[C('valor',6,3)],['Cede y sacás el contenido.',{stone:1,moral:-1}],['Se resiste.',{}],['Hacés un ruido infernal y llaman a la policía.',{heat:2,rep:-1}])]},
{id:'sh_soborno',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Un guardia con precio',
 text:()=>'Un guardia de un depósito dice que dejaría pasar a alguien por una buena cifra. Hay mercadería valiosa adentro.',
 opts:[O('Negociar el precio',[30,30,40],[C('carisma',7,4)],['Cerrás un trato y entrás. Salís con una piedra.',{stone:1,moral:-1}],['Se arrepiente a último momento.',{}],['Te denuncia a sus superiores.',{heat:2,rep:-1}]),
  O('Distraerlo mientras entrás',[30,30,40],[C('sigilo',7,4)],['No se entera de nada y te llevás el botín.',{gainWild:1,moral:-1}],['No lográs entrar.',{}],['Se da vuelta justo cuando pasás.',{heat:1,time:1}])]},
// ===== Misiones Rocket =====
{id:'rk_espionaje',pool:'rocket',kind:'Misión',w:3,req:s=>true,title:'Espionaje industrial',
 text:()=>'La organización quiere los planos de un invento. Hay que copiarlos sin que la empresa lo note.',
 opts:[O('Hackear el sistema de la empresa',[35,30,35],[C('ingenio',6,4)],['Los copiás en minutos. Los jefes están encantados.',{rocketPts:3,st:{ingenio:1}}],['Copiás solo una parte.',{rocketPts:1}],['Te rastrean la conexión.',{heat:2,rocketPts:-1}]),
  O('Colarte como técnico',[35,30,35],[C('sigilo',5,3),C('carisma',4,2)],['Copiás todo con el uniforme puesto.',{rocketPts:3,stone:1}],['Entrás pero no llegás a los planos.',{rocketPts:1}],['Te piden credenciales y no tenés.',{heat:2}])]},
{id:'rk_reclutar',pool:'rocket',kind:'Misión',w:3,req:s=>true,title:'Conseguir nuevos reclutas',
 text:()=>'Los jefes te piden traer a dos o tres jóvenes talentosos a la organización.',
 opts:[O('Convencerlos con promesas',[35,35,30],[C('carisma',6,4)],['Se suman tres y te ganás un ascenso.',{rocketPts:3,moral:-1}],['Se suma uno.',{rocketPts:1}],['Uno te denuncia.',{heat:2}]),
  O('Mostrarles tu poder',[35,30,35],[C('valor',5,3),['p',1]],['Quedan impresionados y se suman.',{rocketPts:2,gainWild:1}],['Se burlan de vos.',{}],['Te desafían y perdés frente a todos.',{rocketPts:-1,rep:-1}])]},
{id:'rk_sabotaje',pool:'rocket',kind:'Misión',w:3,req:s=>true,title:'Sabotear una radio',
 text:()=>'Una radio local difunde denuncias contra la organización. Hay que callarla.',
 opts:[O('Cortar los cables de noche',[30,30,40],[C('sigilo',5,4)],['Quedan sin señal toda la semana.',{rocketPts:2,moral:-1}],['Cortás solo la mitad.',{rocketPts:1}],['Te ven huyendo.',{heat:2}]),
  O('Reprogramar los equipos',[30,30,40],[C('ingenio',6,4)],['Dejás la radio en silencio sin dejar huellas.',{rocketPts:3,st:{ingenio:1}}],['Funciona un rato.',{}],['El técnico te descubre.',{heat:2,rocketPts:-1}])]},
{id:'rk_chantaje',pool:'rocket',kind:'Misión',w:3,req:s=>true,title:'Un favor a cambio de silencio',
 text:()=>'Un funcionario tiene secretos comprometedores. Los jefes quieren que cumpla un favor y que no pregunte.',
 opts:[O('Presionarlo con labia',[35,35,30],[C('carisma',5,4)],['Cede y los jefes se muestran muy satisfechos.',{rocketPts:2,moral:-1}],['Pide tiempo.',{rocketPts:1}],['Te amenaza con llamar a la policía.',{heat:2,rocketPts:-1}]),
  O('Seguirlo para reunir pruebas',[35,30,35],[C('sigilo',5,4),C('ingenio',6,2)],['Reunís todo lo necesario sin que lo note.',{rocketPts:3,stone:1}],['Reunís poco.',{rocketPts:1}],['Te descubre y avisa a todos.',{heat:2}])]},
{id:'rk_prueba',pool:'rocket',kind:'Misión',w:2,req:s=>s.rocketPts>=8,title:'Una prueba de lealtad',
 text:()=>'Un superior quiere ver de qué estás hecho. Te propone tres tareas seguidas sin dormir.',
 opts:[O('Aceptar sin quejas',[30,30,40],[C('valor',6,3),C('cuidado',5,2)],['Las cumplís todas y te nombran de confianza.',{rocketPts:4,st:{valor:1}}],['Cumplís dos de tres.',{rocketPts:1}],['Te quedás dormido en la última.',{rocketPts:-2,heat:1}]),
  O('Delegar con astucia',[35,30,35],[C('ingenio',6,3),C('carisma',5,2)],['Repartís bien y los jefes lo notan.',{rocketPts:3}],['Cumplen a medias.',{rocketPts:1}],['Te descubren pasándole el trabajo a otros.',{rocketPts:-2}])]},
// ===== Rocket: robar Pokémon =====
{id:'rkp_novato',pool:'rk_pk',kind:'Robo de Pokémon',w:3,req:s=>true,title:'Una plaza llena de entrenadores',
 text:()=>'En la plaza hay decenas de chicos con sus Pokémon sueltos, distraídos. Los jefes aceptan cantidad, pero pagan mejor por un ejemplar que casi nadie tiene.',
 opts:[O('Llevarte varios comunes en un descuido',[45,25,30],[C('sigilo',5,3),C('valor',4,2)],['En medio del tumulto cargás cuatro o cinco Pokémon sin que nadie lo note.',{haul:{n:4},rocketPts:2,moral:-1}],['Alcanzás uno solo y salís corriendo.',{gainWild:1}],['Un chico grita y un adulto te ve la cara.',{heat:3,rep:-1}]),
  O('Ir por el que presume el ejemplar raro',[30,30,40],[C('carisma',5,3),C('ingenio',4,2)],['Lo convencés con un «cambio» tramposo y te llevás un ejemplar muy difícil de ver.',{haul:{n:1,rare:true},rocketPts:3,moral:-1}],['Se da cuenta y se va.',{}],['Se lo cuenta a sus padres y empiezan a buscarte.',{heat:2,rep:-1}])]},
{id:'rkp_criadero',pool:'rk_pk',kind:'Robo de Pokémon',w:3,req:s=>true,title:'El criadero de lujo',
 text:()=>'Un criadero de las praderas vende ejemplares carísimos. Hay un corral con muchos comunes y una vitrina con un par de reservados.',
 opts:[O('Abrir el corral de noche y llevarte un lote',[40,30,30],[C('sigilo',6,4)],['Sacás a cinco ejemplares en silencio, sin que ladre un solo perro.',{haul:{zone:'pradera',n:5},rocketPts:2,moral:-1,st:{sigilo:1}}],['Los perros ladran y salís con uno solo.',{gainZone:'pradera'}],['Un Growlithe te muerde y huís lastimado.',{heat:2,time:1}]),
  O('Hacerte pasar por comprador por un reservado',[30,35,35],[C('carisma',6,3),C('ingenio',5,2)],['Te llevás dos de los reservados «para probar» y no volvés nunca más.',{haul:{zone:'pradera',n:2,rare:true},rocketPts:3,moral:-1}],['Te piden un depósito y te vas con las manos vacías.',{}],['Piden tus datos y llaman a la policía.',{heat:3}])]},
{id:'rkp_exposicion',pool:'rk_pk',kind:'Robo de Pokémon',w:3,req:s=>s.rocketPts>=8,title:'La exposición de Pokémon',
 text:()=>'En una exposición se exhiben ejemplares de zonas protegidas. Hay muchos guardias, pero también mucha gente y mucho ruido.',
 opts:[O('Provocar un lío y vaciar varias jaulas',[35,30,35],[C('ingenio',6,3),C('sigilo',6,2)],['Se arma un tumulto y desaparecen cuatro ejemplares dentro de tu mochila.',{haul:{zone:'safari',n:4},rocketPts:2,moral:-1}],['Nadie se descuida ni un segundo.',{}],['Te reconocen entre la multitud.',{heat:3,rep:-1}]),
  O('Hacerte pasar por veterinario y llevarte al premiado',[25,30,45],[C('cuidado',6,3),C('carisma',5,2)],['Te dejan «revisar» al ejemplar estrella y te vas con él, y con otro más.',{haul:{zone:'safari',n:2,rare:true},rocketPts:3,moral:-1}],['Te piden credenciales y te echan con amabilidad.',{}],['Un veterinario de verdad te desenmascara.',{heat:3}])]},
{id:'rkp_refugio',pool:'rk_pk',kind:'Robo de Pokémon',w:3,req:s=>true,title:'El refugio de rescatados',
 text:()=>'Un refugio cuida a Pokémon abandonados en una cueva. Hay muchos comunes en grupo y algún ejemplar fuerte que nadie vigila de cerca.',
 opts:[O('Cargar jaulas con todos los que puedas',[45,25,30],[C('valor',5,3),['p',1]],['Cargás cuatro o cinco jaulas y salís por la salida trasera.',{haul:{zone:'moon',n:4},rocketPts:2,moral:-2}],['Un cuidador te corta el paso y te vas con una sola jaula.',{gainZone:'moon',moral:-1}],['El Pokémon te ataca y los cuidadores te ven.',{heat:2,loseMon:1}]),
  O('Colarte por el más fuerte',[30,30,40],[C('sigilo',6,3)],['Elegís con calma al ejemplar más raro y salís sin dejar rastros.',{haul:{zone:'moon',n:1,rare:true},rocketPts:3,moral:-2}],['Casi te descubren y te retirás.',{}],['Una cámara te filma.',{heat:3,rep:-1}])]},
{id:'rkp_lab',pool:'rk_pk',kind:'Robo de Pokémon',w:3,req:s=>true,title:'Robo en un laboratorio',
 text:()=>'El Equipo Rocket quiere ejemplares raros de un laboratorio de investigación. Hay unas pocas muestras muy valiosas y una sala con muchos animales de prueba.',
 opts:[O('Infiltrarte de noche por las muestras raras',[30,30,40],[['s','sigilo',3]],['Salió limpio: te llevás uno o dos ejemplares muy raros.',{haul:{n:2,rare:true},rocketPts:3,moral:-1}],['Encontrás el lugar vacío.',{rocketPts:1}],['Suena la alarma.',{heat:3}]),
  O('Entrar por la fuerza y sacar a todos los de prueba',[40,25,35],[['s','valor',2],['p',1]],['Superás a los guardias y salís con cinco ejemplares.',{haul:{n:5},rocketPts:2,moral:-1}],['Escapás con las manos vacías.',{heat:2}],['Te rodean los guardias.',{heat:3,loseMon:1}])]},
// ===== Rocket: robar objetos =====
{id:'rki_tienda',pool:'rk_it',kind:'Robo de objetos',w:3,req:s=>true,title:'El depósito de la tienda',
 text:()=>'Una tienda de objetos para entrenadores guarda cajas de piedras evolutivas en un depósito trasero.',
 opts:[O('Vaciar el depósito de noche',[40,30,30],[C('sigilo',6,4)],['Salís con una caja entera de piedras.',{stone:2,rocketPts:2,moral:-1}],['Solo encontrás cajas vacías.',{}],['Salta una alarma silenciosa.',{heat:3}]),
  O('Entrar disfrazado de repartidor',[40,35,25],[C('ingenio',6,3)],['Entrás por la puerta principal y te vas con piedras y una lupa.',{stone:1,item:'lupa',rocketPts:2,moral:-1}],['Te piden la firma de un gerente que no existe.',{}],['El encargado desconfía y avisa.',{heat:2,rep:-1}])]},
{id:'rki_camion',pool:'rk_it',kind:'Robo de objetos',w:3,req:s=>true,title:'El camión de carga',
 text:()=>'Un camión con mercadería pasa por una ruta desierta cada semana. Alguien en la organización conoce el horario.',
 opts:[O('Interceptarlo en la ruta',[35,30,35],[C('valor',6,3),C('sigilo',5,2)],['Descargás todo antes de que llegue la policía.',{stone:2,item:'incienso',rocketPts:2,moral:-1}],['Llegás tarde y el camión ya pasó.',{}],['El chofer pide ayuda por radio.',{heat:3}]),
  O('Subirte al camión mientras anda',[30,30,40],[C('sigilo',6,3),C('valor',5,2)],['Llegás a la carga y salís con lo mejor.',{stone:2,rocketPts:2,moral:-1}],['Te asustás y te bajás a tiempo.',{}],['Te caés del camión y te lastimás.',{time:1,heat:2}])]},
{id:'rki_museo',pool:'rk_it',kind:'Robo de objetos',w:3,req:s=>s.rocketPts>=8,title:'El museo de Pokémon',
 text:()=>'Un museo exhibe una piedra rara y una lupa antigua en una vitrina. El sistema de seguridad es moderno.',
 opts:[O('Desactivar la alarma y abrir la vitrina',[30,30,40],[C('ingenio',6,4),C('sigilo',6,3)],['Salís con la piedra y la lupa en el bolsillo.',{stone:1,item:'lupa',rocketPts:2,moral:-1}],['No lográs abrir la vitrina.',{}],['Suena la alarma de todo el museo.',{heat:3,rep:-1}]),
  O('Pasar como visitante y esperar el cierre',[35,30,35],[C('sigilo',6,3)],['Te escondés hasta que se vacía y te llevás todo.',{stone:2,rocketPts:2,moral:-1}],['Te descubren a la hora del cierre.',{}],['Un guardia te agarra del brazo.',{heat:3}])]},
{id:'rki_mansion',pool:'rk_it',kind:'Robo de objetos',w:3,req:s=>true,title:'La mansión del coleccionista',
 text:()=>'Un coleccionista rico está de viaje y su mansión tiene una caja fuerte con piedras.',
 opts:[O('Abrir la caja fuerte con paciencia',[30,30,40],[C('ingenio',6,4),C('sigilo',5,2)],['Adentro hay piedras y joyas que revendés.',{stone:2,rocketPts:2,moral:-1}],['La caja fuerte está vacía.',{}],['Un mayordomo te ve y llama a la policía.',{heat:3}]),
  O('Forzar la cerradura',[30,25,45],[C('valor',6,3),C('sigilo',5,2)],['Cede y sacás las piedras.',{stone:2,rocketPts:2,moral:-1}],['Hacés ruido y te vas.',{}],['Los perros de guardia te muerden.',{heat:2,time:1}])]},
{id:'rki_lab',pool:'rk_it',kind:'Robo de objetos',w:2,req:s=>s.rocketPts>=40,title:'El laboratorio de investigación',
 text:()=>'Un laboratorio guarda en una caja fuerte un amuleto experimental que aumenta la aparición de Pokémon especiales. Los jefes lo quieren.',
 opts:[O('Infiltrarte y llevártelo',[25,30,45],[C('sigilo',7,4),C('ingenio',6,3)],['Salís con el amuleto y una piedra, y los jefes lo celebran.',{item:'shiny_charm',stone:1,rocketPts:2,moral:-1}],['No encontrás la caja fuerte.',{}],['Te encierran en el sótano un rato.',{heat:3,time:1}])]},
// ===== Rocket: cacería ilegal =====
{id:'rkh_bosque',pool:'rk_hunt',kind:'Cacería',w:3,req:s=>true,title:'Cacería nocturna en el Bosque Verde',
 text:()=>'Un grupo de cazadores del Equipo Rocket se mete de noche en el bosque protegido. Hay mucho que capturar y pocos guardabosques.',
 opts:[O('Tender redes entre los árboles',[40,30,30],[C('ingenio',5,3),C('sigilo',5,2)],['Capturás varios ejemplares y te quedás con el mejor.',{haul:{zone:'bosque',n:3},rocketPts:2,moral:-1}],['Las redes quedan vacías.',{}],['Un guardabosques te ve y te persigue.',{heat:3}]),
  O('Seguir los rastros',[40,30,30],[C('valor',5,3)],['Los rastros te llevan a un grupo y te llevás uno.',{gainZone:'bosque',rocketPts:2,moral:-1}],['Perdés el rastro.',{}],['Un Pokémon furioso te arrastra al barro.',{time:1,loseItem:1}])]},
{id:'rkh_costa',pool:'rk_hunt',kind:'Cacería',w:3,req:s=>true,title:'Pesca ilegal en la costa',
 text:()=>'En una bahía cerrada hay Pokémon acuáticos muy cotizados. Los pescadores de la organización te dan un bote.',
 opts:[O('Barrer la bahía con redes',[40,30,30],[C('valor',5,3),C('cuidado',5,2)],['Subís varios ejemplares y te llevás el mejor.',{haul:{zone:'costa',n:3},rocketPts:2,moral:-1}],['Solo pescás algas.',{}],['La guardia costera te intercepta.',{heat:3}]),
  O('Atraerlos con señuelos',[35,35,30],[C('ingenio',6,3)],['Los señuelos funcionan de maravilla.',{gainZone:'costa',stone:1,rocketPts:2,moral:-1}],['No pica ninguno.',{}],['Se te hunde el bote con parte de tu equipo.',{loseItem:1,time:1}])]},
{id:'rkh_moon',pool:'rk_hunt',kind:'Cacería',w:3,req:s=>true,title:'Las cuevas de Monte Moon',
 text:()=>'En las cuevas de Monte Moon viven Pokémon raros que atraen coleccionistas. Entrar es ilegal, y por eso mismo paga bien.',
 opts:[O('Entrar con linternas y trampas',[35,30,35],[C('valor',6,3),C('sigilo',5,2)],['Volvés con un ejemplar raro y una piedra lunar.',{gainZone:'moon',stone:1,rocketPts:2,moral:-1}],['Te perdés y salís sin nada.',{}],['Un derrumbe te deja varado un tiempo.',{time:2}]),
  O('Esperar en la entrada',[40,40,20],[C('cuidado',5,3)],['Uno sale solo y lo atrapás.',{gainZone:'moon',moral:-1}],['No sale ninguno.',{}],['Te descubre una patrulla.',{heat:2,rep:-1}])]},
{id:'rkh_torre',pool:'rk_hunt',kind:'Cacería',w:3,req:s=>s.rocketPts>=8,title:'La torre embrujada',
 text:()=>'Dicen que en la torre abandonada viven Pokémon fantasma que nadie se atreve a capturar. Para vos es una oportunidad.',
 opts:[O('Subir de noche con trampas',[30,30,40],[C('valor',5,3),C('cuidado',6,2)],['Capturás un ejemplar espectral y una piedra.',{gainZone:'torre',stone:1,rocketPts:2,moral:-1}],['Te asusta un ruido y bajás corriendo.',{}],['Algo te asusta tanto que perdés el rumbo.',{time:2,heat:2}]),
  O('Dejar cebos y esperar abajo',[35,35,30],[C('ingenio',6,3)],['Los cebos atraen a uno que baja solo.',{gainZone:'torre',rocketPts:2,moral:-1}],['Ninguno baja.',{}],['Los cebos atraen a una patrulla.',{heat:3}])]},
{id:'rkh_safari',pool:'rk_hunt',kind:'Cacería',w:2,req:s=>s.rocketPts>=16,title:'Cacería furtiva en el Safari',
 text:()=>'La Zona Safari está vigilada, pero con un uniforme de guardia y una camioneta se puede entrar sin que nadie pregunte.',
 opts:[O('Entrar con un uniforme robado',[30,30,40],[C('carisma',6,3),C('sigilo',6,2)],['Cargás dos ejemplares raros y salís por la puerta principal.',{haul:{zone:'safari',n:2,rare:true},rocketPts:3,moral:-2}],['Te piden la orden de servicio y te vas.',{}],['Un guardia verdadero da la voz de alarma.',{heat:3}]),
  O('Cruzar la valla de noche',[30,30,40],[C('valor',5,3),C('sigilo',6,3)],['Atrapás uno de los más difíciles de ver.',{gainZone:'safari',rocketPts:2,moral:-1}],['No encontrás nada en la oscuridad.',{}],['Te persiguen los Rhyhorn de la reserva.',{heat:2,loseMon:1}])]},

{id:'rkb_mon',pool:'rk_black',kind:'Mercado negro',w:3,trade:'mon',pre:'Un contrabandista de la organización te cuenta que un cliente necesita justo un Pokémon como el que te sobra.',req:s=>dupes(s).length>0,title:'Un cliente sin preguntas',

{id:'rkb_stone',pool:'rk_black',kind:'Mercado negro',w:3,trade:'stone',pre:'Un traficante abre su maletín: piedras de todos los colores, sin factura ni preguntas.',req:s=>dupes(s).length>0,title:'El maletín de piedras',

// ===== Rocket: ascensos (reemplazan los regalos del Profesor Oak) =====
{id:'rk_asc1',pool:'story',kind:'Organización',forced:true,once:true,req:s=>s.rocket&&s.rocketPts>=8,title:'Ascenso a Soldado',
 text:()=>'Un encargado te entrega el uniforme completo, con la «R» roja bordada sobre el pecho: «Ya no sos un recluta. Te ganaste un lugar.»',
 opts:[S('Ponerte el uniforme','Te queda bien. Demasiado bien.',{stone:1,st:{sigilo:1}})]},
{id:'rk_asc3',pool:'story',kind:'Organización',forced:true,once:true,req:s=>s.rocket&&s.rocketPts>=30,title:'Ascenso a Teniente',
 text:()=>'Te ponen al mando de un pequeño escuadrón de reclutas. Uno de ellos te trae, como tributo, un Pokémon que no le servía.',
 opts:[S('Aceptar el mando','Tus órdenes empiezan a ser obedecidas sin preguntar.',{gainWild:1,st:{carisma:1}})]},
{id:'rk_asc5',pool:'story',kind:'Organización',forced:true,once:true,req:s=>s.rocket&&s.rocketPts>=ROCKET_MAX,title:'Giovanni piensa en su retiro',
 text:()=>'En el despacho, Giovanni te mira largo rato: «Estoy cansado, y la organización necesita a alguien que la conduzca. Sos de los pocos que llegaron tan lejos. Pero el mando no se regala: desafiame cuando te sientas listo. Si me vencés, el Equipo Rocket es tuyo.»',
 opts:[S('Escucharlo en silencio','Sabés cuál es el último paso: vencerlo. Podés desafiarlo cuando quieras.',{flag:{giovanniSucesor:true},stone:1})]},
{id:'rk_gift1',pool:'story',kind:'Organización',forced:true,once:true,req:s=>s.rocket&&s.rocketPts>=32,title:'Un superior te felicita',
 text:()=>'Un comandante te cita en la trastienda de un local de apuestas: «Dejaste de ser un recluta. Tomá, el amuleto que le sacamos a un entrenador.»',
 opts:[S('Aceptar el amuleto','Lo guardás sin mirar de dónde vino.',{item:'lucky_charm',stone:1,moral:-1})]},
{id:'rk_gift2',pool:'story',kind:'Organización',forced:true,once:true,req:s=>s.rocket&&s.rocketPts>=52,title:'Giovanni te recibe en su despacho',
 text:()=>'El jefe de la organización te hace pasar a su oficina. Acaricia a su Persian y abre un cajón con mucho cuidado: «Un comandante merece algo especial.»',
 opts:[S('Recibir el Shiny Charm','Un amuleto que antes era de un laboratorio y ahora es tuyo.',{item:'shiny_charm',stone:2,moral:-1})]},
// ===== Gimnasio propio =====
{id:'go_ala',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'Ampliar el gimnasio',
 text:()=>'Tu gimnasio quedó chico y la gente hace fila. Hay que decidir cómo crecer.',
 opts:[O('Diseñar vos los planos',[35,35,30],[C('ingenio',7,4)],['Los planos son geniales y la obra queda espectacular.',{fame:2,st:{ingenio:1}}],['La obra sale correcta.',{fame:1}],['Te pasás de presupuesto.',{fame:-1,loseItem:1}]),
  O('Conseguir apoyo de comerciantes',[40,35,25],[C('carisma',6,3)],['Te financian la ampliación.',{fame:2,rep:1}],['Aportan una parte.',{fame:1}],['Quieren demasiado a cambio y se rompe el trato.',{rep:-1}])]},
{id:'go_rival',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'Un gimnasio rival abre enfrente',
 text:()=>'Otro entrenador abrió un gimnasio a media cuadra del tuyo y le está robando retadores.',
 opts:[O('Ganarte a su público con carisma',[35,35,30],[C('carisma',8,4)],['Tus retadores se multiplican.',{fame:2}],['Quedan parejos.',{fame:1}],['Su campaña es mejor que la tuya.',{fame:-2}]),
  O('Retarlo a un duelo para definir quién es mejor',[30,25,45],[C('valor',7,3),['p',1]],['Lo vencés frente a todos.',{fame:3}],['Empatan y se respetan.',{fame:1}],['Te vence y tu fama se resiente.',{fame:-2}])]},
{id:'go_reparar',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'El techo se viene abajo',
 text:()=>'Después de una tormenta, el techo de tu gimnasio tiene goteras y parte del piso se hundió.',
 opts:[O('Repararlo con tus propias manos',[40,35,25],[C('valor',6,3),C('ingenio',5,2)],['Lo dejás mejor que antes y los retadores lo notan.',{fame:1,st:{valor:1}}],['Lo arreglás a medias.',{}],['Te lastimás y la obra se demora.',{time:1,fame:-1}]),
  O('Contratar a un especialista',[50,35,15],[C('carisma',5,2)],['Queda perfecto y a buen precio.',{fame:1}],['Cuesta una fortuna pero queda bien.',{loseItem:1}],['El especialista era un estafador.',{fame:-1,loseItem:1}])]},
{id:'go_prensa',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'Una periodista quiere una entrevista',
 text:()=>'Una periodista de un diario regional llega a tu gimnasio y te pide una entrevista sobre tu carrera.',
 opts:[O('Responder con carisma',[35,35,30],[C('carisma',8,4)],['La nota sale genial y tu nombre se conoce en toda la región.',{fame:3}],['La nota es discreta.',{fame:1}],['Tu respuesta se malinterpreta y la gente se enoja.',{fame:-2,rep:-1}]),
  O('Mostrarle cómo se entrena en el gimnasio',[40,35,25],[C('ingenio',6,3)],['Queda fascinada y escribe maravillas.',{fame:2}],['Escribe algo correcto.',{fame:1}],['Se aburre y no publica nada.',{fame:-1}])]},
{id:'go_torneo',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'Torneo regional de gimnasios',
 text:()=>'La Liga invita a tu gimnasio a un torneo regional. Es una gran vidriera.',
 opts:[O('Participar con tu equipo estrella',[30,25,45],[C('valor',8,3),['p',1]],['Llegás a la final y tu gimnasio se agranda.',{fame:3}],['Perdés en semifinales con honor.',{fame:1}],['Quedás eliminado en la primera ronda.',{fame:-2}]),
  O('Mandar a un alumno en tu lugar',[40,40,20],[C('cuidado',6,3),C('carisma',5,2)],['Tu alumno brilla y todos hablan de tu método.',{fame:2,rep:1}],['Pasa a la segunda ronda.',{fame:1}],['Cae rápido y la gente se ríe.',{fame:-1}])]},
// ===== Trabajo de campo (Profesor) =====
{id:'fd_expedicion',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Expedición a una zona remota',
 text:()=>'El laboratorio necesita datos de una región de difícil acceso. Hay que caminar días enteros.',
 opts:[O('Ir por la ruta más corta',[35,30,35],[C('valor',7,4)],['Llegás rápido y volvés con datos únicos.',{rp:4,st:{valor:1}}],['Volvés con datos modestos.',{rp:1}],['Te lastimás en el camino y volvés sin nada.',{time:1,rp:-1}]),
  O('Armar una logística cuidadosa',[40,35,25],[C('cuidado',6,3),C('ingenio',6,2)],['Todo sale como lo planeaste y juntás de todo.',{rp:3,stone:1}],['Juntás lo básico.',{rp:1}],['Te quedás sin provisiones.',{loseItem:1,time:1}])]},
{id:'fd_cueva',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Una cueva con Pokémon tímidos',
 text:()=>'En una cueva viven Pokémon que huyen de cualquier ruido. Quieren estudiarlos sin molestarlos.',
 opts:[O('Observarlos sin ser visto',[35,30,35],[C('sigilo',6,4)],['Registrás su comportamiento nocturno por primera vez.',{rp:4,st:{sigilo:1}}],['Registrás algo, pero poco.',{rp:1}],['Los espantás y volvés con las manos vacías.',{rp:-1}]),
  O('Analizar rastros y excrementos',[40,35,25],[C('ingenio',8,4)],['Deducís sus hábitos con un análisis brillante.',{rp:3,st:{ingenio:1}}],['Aprendés algo útil.',{rp:1}],['Tu hipótesis es errónea y te critican.',{rp:-1,rep:-1}])]},
{id:'fd_grabar',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Grabar un ritual de apareamiento',
 text:()=>'Una especie poco estudiada está por empezar su ritual. Pocos investigadores lograron verlo.',
 opts:[O('Instalar cámaras con cuidado',[35,35,30],[C('cuidado',7,4)],['Lográs imágenes impecables.',{rp:4,moral:1}],['Las imágenes salen borrosas.',{rp:1}],['Los Pokémon se asustan y abandonan el lugar.',{rp:-1}]),
  O('Esconderte cerca con la cámara en mano',[35,30,35],[C('sigilo',7,4)],['Lográs una toma única.',{rp:4,st:{sigilo:1}}],['Pasás horas sin ver nada.',{time:1}],['Te descubren y abandonan el ritual.',{rp:-2}])]},
{id:'fd_etiquetado',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Etiquetar ejemplares',
 text:()=>'El laboratorio quiere etiquetar a una población de Pokémon para seguir sus migraciones.',
 opts:[O('Capturarlos y etiquetarlos con delicadeza',[40,35,25],[C('cuidado',6,4)],['Etiquetás a todos sin lastimar a ninguno.',{rp:3,moral:1}],['Etiquetás a la mitad.',{rp:1}],['Uno se lastima y te sentís mal.',{rp:-1,moral:-1}]),
  O('Diseñar un sistema de rastreo propio',[35,30,35],[C('ingenio',7,4)],['Tu sistema funciona mejor que los del laboratorio.',{rp:4,st:{ingenio:1}}],['Funciona a medias.',{rp:1}],['Falla y perdés los datos.',{rp:-2}])]},
{id:'fd_congreso',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Un congreso de naturalistas',
 text:()=>'Te invitan a un congreso de naturalistas. Es una gran oportunidad para mostrar tus avances y conocer a gente.',
 opts:[O('Presentar tus resultados',[35,30,35],[C('carisma',7,3),C('ingenio',7,3)],['Aplausos de pie y varias ofertas de colaboración.',{rp:4,rep:1}],['Una presentación correcta.',{rp:1}],['Te hacen preguntas imposibles y te trabás.',{rp:-1,rep:-1}]),
  O('Hacer contactos en los pasillos',[45,35,20],[C('carisma',6,4)],['Te llevás varios contactos útiles y una piedra de regalo.',{rp:2,stone:1}],['Conocés a unas pocas personas.',{rp:1}],['Pasás desapercibido y perdés una semana en pasillos.',{time:1}])]},
// ===== Eventos nuevos (equilibran el uso de cada stat en todas las carreras) =====
{id:'sh_herido',pool:'shady',kind:'Turbio',w:3,req:s=>true,title:'Un Pokémon herido en un depósito',
 text:()=>'En el fondo de un depósito abandonado encontrás a un Pokémon herido, atado a una caja. Su dueño no está.',
 opts:[O('Curarlo con paciencia',[35,35,30],[C('cuidado',6,3)],['Se recupera y decide quedarse con vos.',{gainWild:1,moral:1,st:{cuidado:1}}],['Lo curás, pero se escapa apenas puede.',{moral:1}],['Se asusta, te muerde y el ruido atrae a alguien.',{heat:1,time:1}]),
  O('Llevártelo sin que nadie te vea',[30,30,40],[C('sigilo',6,3)],['Salís con el Pokémon sin dejar rastro.',{gainWild:1,moral:-1}],['No encontrás cómo sacarlo.',{}],['Alguien te ve cargándolo.',{heat:2,moral:-1}])]},
{id:'rk_enfermos',pool:'rocket',kind:'Misión',w:3,req:s=>true,title:'Pokémon robados enfermos',
 text:()=>'Un cargamento de Pokémon robados llegó enfermo al escondite. Si no los ponés en condiciones, la organización pierde plata.',
 opts:[O('Cuidarlos vos mismo',[35,35,30],[C('cuidado',6,3)],['Los dejás sanos y tus superiores toman nota.',{rocketPts:2,st:{cuidado:1}}],['Salvás a la mayoría.',{rocketPts:1}],['Algunos empeoran y te echan la culpa.',{time:1}]),
  O('Venderlos rápido a un comprador',[35,30,35],[C('carisma',6,3)],['Cerrás un buen negocio y te quedás con una piedra.',{rocketPts:2,stone:1,moral:-1}],['Los vendés a precio bajo.',{rocketPts:1,moral:-1}],['El comprador sospecha y avisa a la policía.',{heat:2}])]},
{id:'go_espia',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'Alguien espía tus entrenamientos',
 text:()=>'Notás a una persona que sigue tus entrenamientos y anota todo. Puede ser del gimnasio rival.',
 opts:[O('Seguirlo sin que te vea',[35,35,30],[C('sigilo',6,3)],['Lo descubrís y lo mandás de vuelta con las manos vacías.',{fame:2,st:{sigilo:1}}],['Lo perdés de vista, pero se va.',{fame:1}],['Te ve y se corre la voz de que perseguís gente.',{fame:-1}]),
  O('Cambiar tu estrategia con astucia',[40,35,25],[C('ingenio',6,3)],['Le das información falsa y el rival se confunde.',{fame:2}],['Cambiás un poco tus rutinas.',{fame:1}],['Te complicás y tus alumnos se confunden.',{fame:-1}])]},
{id:'go_fiebre',pool:'gymown',kind:'Gimnasio',w:3,req:s=>true,title:'Los Pokémon de tus alumnos tienen fiebre',
 text:()=>'Una racha de fiebre se extiende entre los Pokémon de los alumnos. Los padres miran con desconfianza.',
 opts:[O('Atenderlos vos mismo',[40,35,25],[C('cuidado',6,3)],['Los curás a todos y los padres te lo agradecen.',{fame:2,rep:1,st:{cuidado:1}}],['Curás a la mayoría.',{fame:1}],['Te equivocás con un tratamiento y tardás en reponerte.',{fame:-1}]),
  O('Pedir ayuda y explicar con calma',[45,35,20],[C('carisma',5,3)],['La enfermera del pueblo te apoya y la gente confía en vos.',{fame:1,rep:1}],['Todo se resuelve despacio.',{fame:1}],['Se pone en duda tu capacidad.',{fame:-1,rep:-1}])]},
{id:'rki_comprador',pool:'rk_it',kind:'Robo de objetos',w:3,req:s=>true,title:'Un comprador para lo robado',
 text:()=>'Te sobran objetos robados y un coleccionista sin escrúpulos ofrece comprarlos. Hay que saber negociar.',
 opts:[O('Regatear con labia',[35,35,30],[C('carisma',6,3)],['Cerrás un gran negocio y te dan dos piedras.',{stone:2,rocketPts:2,moral:-1}],['Cambiás todo por una piedra.',{stone:1,rocketPts:1,moral:-1}],['Te tomó el pelo y se queda con todo.',{heat:1,loseItem:1}]),
  O('Armar un trueque con astucia',[35,35,30],[C('ingenio',6,3),C('sigilo',5,2)],['Combinás el trueque y salís ganando.',{stone:2,rocketPts:2,moral:-1}],['Un trueque justo.',{stone:1,rocketPts:1,moral:-1}],['Se arma un lío y el coleccionista desaparece.',{heat:2}])]},
{id:'hp_ladron',pool:'help',kind:'Ayudar',w:3,req:s=>true,title:'Un ladrón en el mercado',
 text:()=>'Alguien le robó la caja a un puesto del mercado y se escabulló entre la gente. El dueño no sabe qué hacer.',
 opts:[O('Seguirlo en silencio hasta su escondite',[40,35,25],[C('sigilo',5,3)],['Lo seguís, recuperás la caja y el pueblo te lo agradece.',{rep:2,moral:1,st:{sigilo:1}}],['Recuperás una parte.',{rep:1}],['Te ve y se escapa. Perdés la tarde.',{time:1}]),
  O('Avisar a todos con calma y organizar la búsqueda',[50,35,15],[C('carisma',4,3)],['Entre todos lo acorralan y devuelve la caja.',{rep:1,moral:1,st:{carisma:1}}],['La gente colabora un rato.',{rep:1}],['Se arma confusión y acusan a un inocente.',{rep:-1}])]},
{id:'fd_sendero',pool:'field',kind:'Laboratorio',w:3,req:s=>true,title:'Un Pokémon bloquea el sendero',
 text:()=>'En plena salida de campo, un Pokémon grande y malhumorado se planta en el único camino hacia la zona de estudio.',
 opts:[O('Plantarte con firmeza hasta que se corra',[35,35,30],[C('valor',6,3)],['Se aparta y llegás a tiempo con datos de sobra.',{rp:3,st:{valor:1}}],['Rodeás por otro lado y reunís algo.',{rp:1}],['Te embiste y se arruina parte del equipo.',{loseItem:1}]),
  O('Calmarlo con paciencia y cuidado',[40,35,25],[C('cuidado',6,3)],['Lo calmás y te deja observarlo de cerca.',{rp:3,st:{cuidado:1}}],['Te deja pasar sin más.',{rp:1}],['Se asusta y tardás horas en recuperar la calma.',{time:1}])]},
// ===== Combates: eventos de pelea para todos los stats (el Valor pesa más, pero no es el único camino) =====
{id:'cb_callejero',pool:'random',kind:'Combate',w:3,req:s=>age(s)>=11,title:'Un entrenador callejero te desafía',
 text:()=>'En una esquina, un entrenador con una gorra gastada te reta: «Si ganás, te llevás lo que tengo. Si perdés, me invitás un helado.»',
 opts:[O('Aceptar y pelear con todo',[38,22,40],[['s','valor',3],['p',1]],['Ganás con claridad y se corre la voz.',{st:{valor:1},rep:1,stone:1}],['Empatan y se dan la mano.',{}],['Te vence y perdés la tarde.',{time:1,rep:-1}]),
  O('Dejar que tu Pokémon decida cómo pelear',[40,25,35],[['s','cuidado',3],['p',1]],['Tu Pokémon se luce y entienden cómo trabajan juntos.',{st:{cuidado:1},rep:1}],['Es una batalla pareja.',{}],['Tu Pokémon no te hace caso y perdés feo.',{rep:-1}])]},
{id:'cb_revancha',pool:'random',kind:'Combate',w:3,req:s=>age(s)>=12&&s.badges.length>=1&&!s.rocket,title:'Revancha con tu rival',
 text:()=>'Blue te espera en un cruce con los brazos cruzados: «La última vez tuve mala suerte. Hoy no vas a zafar.»',
 opts:[O('Plantear una estrategia',[35,25,40],[['s','ingenio',3],['p',1]],['Leés sus movimientos y lo derrotás con un truco.',{st:{ingenio:1},rep:1}],['Resolvés a medias y queda parejo.',{}],['Se anticipa a todo y te vence.',{rep:-1}]),
  O('Pelear de frente',[35,25,40],[['s','valor',3],['p',1]],['Ganás por pura fuerza.',{st:{valor:1},rep:1,gainWild:1}],['Una batalla durísima que no define nada.',{}],['Te supera y quedás agotado.',{time:1}])]},
{id:'cb_doble',pool:'random',kind:'Combate',w:2,req:s=>age(s)>=12,title:'Un duelo doble',
 text:()=>'Dos entrenadores buscan pareja para un duelo doble en la plaza. Si ganan, se quedan con el escenario por toda la semana.',
 opts:[O('Coordinar con tu pareja por señas',[40,25,35],[['s','carisma',3],['p',1]],['Se entienden al toque y ganan.',{st:{carisma:1},rep:1}],['Pelean parejo y empatan.',{}],['Se pisan entre ustedes y pierden.',{rep:-1}]),
  O('Armar la estrategia de antemano',[35,25,40],[['s','ingenio',3],['t',['Psychic','Ghost','Dark'],3]],['Tu plan funciona de memoria.',{st:{ingenio:1},rep:1}],['Salvan el resultado con un empate.',{}],['El plan se deshace en el primer turno.',{rep:-1}])]},
{id:'cb_emboscada',pool:'random',kind:'Combate',w:3,req:s=>age(s)>=13,title:'Una emboscada en el camino',
 text:()=>'Tres entrenadores te cierran el paso en un sendero angosto y piden que les dejes algo «por el peaje».',
 opts:[O('Colarte por los costados sin pelear',[35,25,40],[['s','sigilo',3]],['Pasás sin que lo noten. Uno de ellos queda confundido.',{st:{sigilo:1}}],['Te ven, pero te dejan seguir.',{}],['Te atrapan y perdés algo.',{loseItem:1}]),
  O('Plantarte y pelear',[32,26,42],[['s','valor',3],['p',1]],['Los vencés y dejan lo que habían juntado.',{st:{valor:1},rep:1,stone:1}],['Te dejan pasar de mala gana.',{}],['Te superan en número.',{loseItem:1,rep:-1}])]},
{id:'cb_barrio',pool:'random',kind:'Combate',w:3,req:s=>age(s)>=11,title:'Torneo de barrio',
 text:()=>'Hay un torneo informal de batallas en el pueblo. Premio: una piedra y el respeto de los vecinos.',
 opts:[O('Competir con tu equipo',[38,24,38],[['s','valor',2],['p',2]],['Llegás hasta la final y ganás.',{st:{valor:1},rep:2,stone:1}],['Llegás a semifinales.',{rep:1}],['Caés en la primera ronda.',{rep:-1}]),
  O('Aguantar con paciencia y resistir',[38,24,38],[['s','cuidado',3],['p',1]],['Tus Pokémon aguantan hasta el final y ganás.',{st:{cuidado:1},rep:2}],['Resistís un rato y listo.',{rep:1}],['Se cansan antes de tiempo.',{time:1}])]},
{id:'cb_exhibicion',pool:'random',kind:'Combate',w:2,req:s=>age(s)>=12,title:'Una exhibición con público',
 text:()=>'Te invitan a una batalla de exhibición en la feria. No hay premio, pero hay mucha gente mirando.',
 opts:[O('Hacer de la batalla un espectáculo',[38,24,38],[['s','carisma',3],['p',1]],['El público aplaude de pie.',{st:{carisma:1},rep:2}],['La gente se divierte.',{rep:1}],['Te pasás de pretencioso y se burlan.',{rep:-1}]),
  O('Concentrarte y ganar sin vueltas',[38,24,38],[['s','valor',2],['p',1]],['Una victoria limpia y seria.',{st:{valor:1},rep:1}],['Todo parejo y sin brillo.',{}],['Perdés ante todos.',{rep:-1}])]},
{id:'cb_furioso',pool:'random',kind:'Combate',w:2,req:s=>age(s)>=12,title:'Un Pokémon salvaje enfurecido',
 text:()=>'Un Pokémon salvaje, herido y furioso, embiste a todo el que se le acerque. Los viajeros no se animan a cruzar.',
 opts:[O('Calmarlo con paciencia',[38,22,40],[['s','cuidado',3]],['Lo calmás y los viajeros te agradecen.',{st:{cuidado:1},rep:2}],['Se aleja solo.',{rep:1}],['Te embiste igual.',{time:1}]),
  O('Enfrentarlo con tu equipo',[34,24,42],[['s','valor',3],['p',1]],['Lo dominás sin lastimarlo y quedás como un héroe.',{st:{valor:1},rep:2,gainWild:1}],['Lo espantás un rato.',{rep:1}],['Tus Pokémon salen golpeados.',{time:1}])]},
{id:'cb_veterano',pool:'random',kind:'Combate',w:2,req:s=>age(s)>=14,title:'Un veterano te propone un duelo',
 text:()=>'Un viejo entrenador te estudia desde hace rato: «Yo veo cosas que vos todavía no. ¿Te animás a un duelo?»',
 opts:[O('Leer su estilo antes de pelear',[34,24,42],[['s','ingenio',3],['p',1]],['Adivinás su táctica. Él te felicita.',{st:{ingenio:1},rep:1}],['Aprendés algo, aunque no ganás.',{st:{ingenio:1}}],['Te supera con experiencia.',{rep:-1}]),
  O('Ir al choque sin dudar',[30,26,44],[['s','valor',3],['p',1]],['Aguantás todo lo que te tira.',{st:{valor:1},rep:1}],['Pierdan o ganen, los dos salen contentos.',{}],['Te tumba en tres turnos.',{rep:-1}])]},
{id:'cb_sombras',pool:'random',kind:'Combate',w:3,req:s=>age(s)>=13,title:'Un duelo en la oscuridad',
 text:()=>'Te cruzás con un entrenador en una cueva sin luz y los dos aceptan pelear a ciegas, guiándose solo por el ruido.',
 opts:[O('Moverte sin hacer ruido y atacar de sorpresa',[36,24,40],[['s','sigilo',3],['p',1]],['Lo sorprendés y ganás sin que te toque.',{st:{sigilo:1},rep:1}],['Ninguno logra aprovechar la ventaja.',{}],['Te delata un paso en falso.',{rep:-1}]),
  O('Pelear de frente sin importar la oscuridad',[34,24,42],[['s','valor',3],['p',1]],['Ganás por pura firmeza.',{st:{valor:1},rep:1}],['Empate a ciegas.',{}],['Perdés el rumbo y la pelea.',{time:1}])]},
{id:'cb_trampa',pool:'random',kind:'Combate',w:2,req:s=>age(s)>=13,title:'Una trampa para entrenadores',
 text:()=>'Alguien dejó una trampa de redes en un sendero para quedarse con los Pokémon de los viajeros. Los dueños aparecen justo cuando la encontrás.',
 opts:[O('Desarmarla en silencio y esconderte',[36,24,40],[['s','sigilo',3],['s','ingenio',1]],['Los dejás con las manos vacías y cuidás a otros viajeros.',{st:{sigilo:1},rep:2}],['Desarmás la trampa y te vas.',{rep:1}],['Te descubren y te persiguen.',{time:1,rep:-1}]),
  O('Enfrentarlos con tu equipo',[34,24,42],[['s','valor',3],['p',1]],['Los vencés y se van con la cola entre las patas.',{st:{valor:1},rep:2,gainWild:1}],['Los espantás sin que haya pelea.',{rep:1}],['Salís golpeado.',{time:1}])]},
// ===== Objetos de origen: se pueden conseguir por eventos aunque no seas de ese origen (aparecen hasta que lo conseguís) =====
{id:'it_incienso',pool:'random',kind:'Objeto',w:2,req:s=>age(s)>=11&&!s.items.incienso,title:'La anciana de los inciensos',
 text:()=>'En una feria, una anciana vende inciensos que dicen atraer a los Pokémon raros. Su puesto está lleno de humo y de trabajo.',
 opts:[O('Ayudarla a atender el puesto',[38,22,40],[C('cuidado',5,3)],['Trabajás toda la tarde y, agradecida, te regala un Incienso.',{item:'incienso',rep:1}],['Te agradece con un par de caramelos.',{}],['Volcás una olla y te echa del puesto.',{rep:-1}]),
  O('Regatear el precio con labia',[36,24,40],[C('carisma',5,3)],['Cierran el trato y te llevás el Incienso a buen precio.',{item:'incienso'}],['No cedés ni ella tampoco.',{}],['Se ofende y te despide.',{rep:-1}])]},
{id:'it_lupa',pool:'random',kind:'Objeto',w:2,req:s=>age(s)>=11&&!s.items.lupa,title:'Una lupa olvidada',
 text:()=>'Un investigador dejó su lupa de campo sobre un banco y se fue corriendo detrás de un Pokémon. Antes de irse, dijo que se la daría a quien la cuidara.',
 opts:[O('Resolver el acertijo que dejó anotado',[38,22,40],[C('ingenio',5,3)],['Resolvés el acertijo y te regala la Lupa de investigador.',{item:'lupa',st:{ingenio:1}}],['Lo resolvés a medias y te agradece.',{}],['Te equivocás y se pierde la tarde.',{time:1}]),
  O('Esperarlo y cuidar sus notas',[40,24,36],[C('cuidado',5,3)],['Vuelve, ve que cuidaste todo y te regala la Lupa.',{item:'lupa',rep:1}],['Tarda mucho y te vas.',{}],['Se mojan sus notas con la lluvia.',{rep:-1}])]},
{id:'it_piedra_dura',pool:'random',kind:'Objeto',w:2,req:s=>age(s)>=12&&!s.items.piedra_dura,title:'Un minero retirado',
 text:()=>'Un minero retirado te cuenta que guarda una Piedra Dura de sus años en las minas de Ciudad Plateada. «Se la doy a quien me demuestre que sabe de cuevas.»',
 opts:[O('Ayudarlo a cargar sus herramientas por el sendero',[38,22,40],[C('valor',5,3)],['Aguantás todo el camino y te da la Piedra Dura.',{item:'piedra_dura',st:{valor:1}}],['Te agradece con una charla.',{}],['Te lastimás la espalda.',{time:1}]),
  O('Leer su mapa de la veta y marcar la ruta segura',[40,22,38],[C('ingenio',5,3)],['Acertás la ruta y te regala la Piedra Dura.',{item:'piedra_dura'}],['Te corrige y no te la da.',{}],['Te perdés en el mapa.',{time:1}])]},
{id:'it_pepita',pool:'random',kind:'Objeto',w:2,req:s=>age(s)>=12&&!s.items.pepita,title:'Un comerciante del puerto',
 text:()=>'Un comerciante de Ciudad Carmín presume una Pepita de oro que le trae suerte en los negocios. Dice que la cambiaría por «alguien con buen ojo para el trato».',
 opts:[O('Negociar con carisma',[38,22,40],[C('carisma',5,3)],['Te cae simpático y te la regala.',{item:'pepita',st:{carisma:1}}],['Se ríe y te invita un café.',{}],['Se enoja y te echa del puesto.',{rep:-1}]),
  O('Demostrarle que sabés hacer cuentas',[40,22,38],[C('ingenio',5,3)],['Detectás un error en sus números y te da la Pepita de agradecimiento.',{item:'pepita'}],['No le convence.',{}],['Te equivocás en público.',{rep:-1}])]},

// En los trabajos turbios y del Equipo Rocket lo que sobra del neutral va sobre todo a «bien»: más «mal» significaría más Heat y arrestos injustos
const HEAT_POOLS=['shady','rocket','rk_pk','rk_it','rk_hunt','rk_black'];
EV.forEach(e=>{if(HEAT_POOLS.includes(e.pool))for(const o of e.opts)if(!o.sure)o.base=capNeutral(o.base0,0.7);});
EV.forEach(e=>{e.opts.forEach(o=>{o.irrev=!!o.irrev;});});
// La reputación cuenta en los eventos sociales: ayudar a la gente y cualquier desafío donde pese el Carisma (no en los turbios ni en los de Rocket)
EV.forEach(e=>{
  if(e.pool==='shady'||e.pool==='rocket'||(e.also&&(e.also.includes('shady')||e.also.includes('rocket'))))return;
  e.opts.forEach(o=>{if(o.sure)return;if(e.pool==='help'||(o.mods||[]).some(m=>(m[0]==='s'||m[0]==='c')&&m[1]==='carisma'))o.mods.push(['r']);});
});

function forcedEvent(s){const e=EV.find(e=>e.forced&&!e.extra&&(!e.once||!s.seen[e.id])&&e.req(s));return e?(e.build?e.build(s):e):null;}
// Eventos "extra": se suman al final de la estación, sin reemplazar al evento de la acción (así un duelo no le quita un evento a nadie)
function pendingExtra(s){const e=EV.find(e=>e.forced&&e.extra&&(!e.once||!s.seen[e.id])&&e.req(s));return e?(e.build?e.build(s):e):null;}
function pickEvent(s,pool){
  let c=EV.filter(e=>(e.pool===pool||(e.also&&e.also.includes(pool)))&&(!e.once||!s.seen[e.id])&&(!e.req||e.req(s)));
  const fresh=c.filter(e=>!s.recent.includes(e.id));
  if(fresh.length)c=fresh;
  if(!c.length)return null;
  const e=wpick(c,e=>typeof e.w==='function'?e.w(s):(e.w||1));
  return e.trade?buildTrade(s,e):e;
}
function nextEvent(s,pool){
  const f=forcedEvent(s);if(f)return f;
  if(pool)return pickEvent(s,pool);
  return R()<EVENT_P?pickEvent(s,'random'):null;
}
function resolveOption(s,ev,idx){
  const opt=ev.opts[idx];const od=oddsFor(s,opt);const band=opt.sure?'g':rollBand(od.p);
  const [text,fx]=opt.out[band];
  const lines=applyFx(s,fx||{});
  if(band==='g'&&!opt.sure){ // aprender haciendo: un desafío que exigía un stat que todavía no dominás te enseña
    for(const m of opt.mods||[]){
      if(m[0]!=='c')continue;
      if(s.st[m[1]]<m[2]+3&&s.st[m[1]]<STAT_CAP){s.st[m[1]]++;lines.push('📈 Aprendiste en el desafío: +1 '+SL[m[1]]+' (exigía '+m[2]+')');break;}
    }
  }
  s.seen[ev.id]=true;s.recent.push(ev.id);if(s.recent.length>8)s.recent.shift();
  return {band,text,lines,odds:od.p,sure:!!opt.sure,roll:opt.sure?null:lastRoll};
}
